<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Editor</title>
<style>
:root { color-scheme:dark; font:16px system-ui,sans-serif; color:#cfd7f8; background:#120f19; }
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(ellipse at top,#251a3b,transparent 52%); min-height:100vh; }
main { width:min(1040px,100%); padding:clamp(14px,3vw,32px); margin:auto; }
header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
h1 { font:bold clamp(28px,5vw,42px) Georgia,serif; margin:0; }
a { color:#798fee; }
button { font:inherit; min-height:44px; padding:8px 12px; color:inherit; background:#231b33; border:1px solid #5e4993; border-radius:6px; cursor:pointer; touch-action:manipulation; }
button:disabled { opacity:.45; cursor:default; }
button[aria-pressed=true] { background:#798eee; color:#170f26; border-color:#798eee; }
button:focus-visible, .board:focus-visible { outline:2px solid #9babf3; outline-offset:2px; }
.workspace { display:grid; grid-template-columns:205px minmax(0,1fr); align-items:start; gap:14px; }
.tools,.map { background:#191424; border:1px solid #4a386e; border-radius:10px; padding:14px; }
.palette,.toolbar { display:flex; gap:6px; flex-wrap:wrap; }
.palette { display:grid; }
.palette button { text-align:left; }
.tools h2 { font-size:1rem; margin:0 0 8px; }
.toolbar { margin-bottom:12px; }
#status { min-height:2.75em; margin:10px 0 0; color:#a2afe7; }
.board { overflow:auto; padding:4px; }
#grid { display:grid; grid-template-columns:repeat(13,minmax(36px,1fr)); width:max(100%, 492px); gap:2px; }
.cell { position:relative; aspect-ratio:1; min-height:0; padding:0; border-radius:3px; border-color:#3b2f53; background:#14111b; color:#e9ecfc; font-size:clamp(10px,2vw,14px); font-weight:bold; }
.cell:hover { border-color:#a3b2f4; }
.cell:focus-visible { z-index:1; outline-offset:0; }

.workspace { grid-template-columns:260px minmax(0,1fr); }
.palette { max-height:54vh; overflow:auto; padding:3px; }
.palette button {
 display:flex; align-items:center; gap:9px; min-height:54px; padding:4px 8px; line-height:1.2;
}
.prop-thumb { width:46px; height:46px; flex:none; object-fit:contain; pointer-events:none; }
.cell .prop-thumb { display:block; width:100%; height:100%; position:absolute; inset:0; padding:2px; }
@media(max-width:720px) {
 .palette button { flex:1 1 145px; }
}
.cell[data-cover=full] { background:#4a3f8a; }
.cell[data-cover=low] { background:#2f5577; }
.cell[data-cover=soft] { background:#7d3f86; }
.cell[data-anchor=true] { border-color:#7c91eb; }
.cell[data-entrance=true] { background:#375442; }
input, select { font:inherit; color:inherit; background:#14111b; border:1px solid #5e4993; border-radius:6px; padding:9px; min-width:0; }
.toolbar input[type=text] { flex:1 1 160px; }
#theme-note { color:#838ed5; margin:4px 0 10px; font-size:.85rem; }
.theme-pick { display:flex; flex-direction:column; gap:4px; }
.theme-pick select { width:100%; }
#prop-info { color:#a2afe7; margin:8px 0; min-height:2.5em; font-size:.9rem; }
@media(max-width:720px) {
 .workspace { grid-template-columns:1fr; }
 .palette { display:flex; max-height:150px; }
 .tools,.map { padding:10px; }
}

.cell[data-selected=true] { background:#3d4f9c; box-shadow:inset 0 0 0 2px #8296ef; }
.cell[data-preview=valid] { background:#355941; box-shadow:inset 0 0 0 2px #9dd5a6; }
.cell[data-preview=blocked] { background:#653d35; box-shadow:inset 0 0 0 2px #f1a498; }
.cell .prop-thumb[data-wide=true] { width:calc(200% + 4px); }
.cell .prop-thumb[data-vertical=true] { width:calc(200% + 4px); transform-origin:0 0; transform:translateX(calc(50% - 2px)) rotate(90deg); }
.cell .prop-thumb[data-turn=true] { transform:rotate(90deg); }
.cell .placed-art { z-index:1; }
.cell .preview-art { z-index:2; opacity:.65; }
.cell[data-moving=true] .placed-art { opacity:.3; }
#grid { isolation:isolate; }
.edit-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.cell .prop-thumb[data-arch=true] { width:calc(300% + 8px); left:calc(-100% - 4px); }
.cell .prop-thumb[data-arch=true][data-vertical=true] { transform-origin:center; transform:rotate(90deg); }
#room-preview { grid-column:1 / -1; }
.palette button[data-loot=true]::after { content:"Chest"; margin-left:auto; font-size:.7rem; color:#9ed19a; border:1px solid #4d7a58; border-radius:4px; padding:1px 5px; }
@media(min-width:1180px) {
 main:has(#room-preview:not([hidden])) { width:min(1640px,100%); }
 .workspace:has(#room-preview:not([hidden])) { grid-template-columns:220px minmax(0,1fr) minmax(0,1fr); }
 #room-preview { grid-column:auto; }
}
#room-preview[hidden], #preview-controls[hidden] { display:none; }
#room-preview h2 { font-size:1rem; margin:0 0 8px; }
#preview-stage { height:clamp(265px,55vh,620px); overflow:hidden; border-radius:7px; background:#100d17; touch-action:none; cursor:grab; }
#preview-stage:active { cursor:grabbing; }
#preview-stage canvas { width:100%; height:100%; display:block; }
#preview-status { padding:12px; }

@media(min-width:900px) and (min-height:520px) {
 html,body { height:100%; overflow:hidden; }
 body { min-height:0; }
 main,main:has(#room-preview:not([hidden])) { width:100%; max-width:2000px; height:100vh; padding:10px 16px; display:flex; flex-direction:column; }
 header { margin-bottom:8px; }
 h1 { font-size:26px; }
 button { min-height:34px; padding:4px 10px; }
 input,select { padding:5px 8px; }
 .workspace,.workspace:has(#room-preview:not([hidden])) { flex:1; min-height:0; grid-template-columns:280px minmax(0,1fr); align-items:stretch; }
 .workspace:has(#room-preview:not([hidden])) { grid-template-columns:280px minmax(0,1.35fr) minmax(0,1fr); }
 #room-preview,#room-preview:not([hidden]) { grid-column:auto; }
 .tools,.map { min-height:0; padding:10px; }
 .tools { display:flex; flex-direction:column; overflow:auto; }
 .palette { flex:1 1 120px; max-height:none; min-height:120px; }
 .palette button { min-height:48px; }
 #theme-note { margin:2px 0 6px; font-size:.78rem; }
 #prop-info { margin:4px 0; min-height:0; font-size:.82rem; }
 .toolbar { margin-bottom:8px; gap:5px; }
 .edit-actions { margin-top:6px; }
 #status { min-height:0; margin:6px 0 0; font-size:.85rem; }
 .map { display:flex; flex-direction:column; overflow:hidden; }
 .toolbar,.edit-actions { flex:none; }
 .board { flex:1; min-height:0; display:flex; align-items:flex-start; justify-content:center; overflow:auto; }
 #grid { grid-template-columns:repeat(13,1fr); width:min(100%, calc(100vh - 170px)); }
 #room-preview { display:flex; flex-direction:column; overflow:hidden; }
 #room-preview[hidden] { display:none; }
 #preview-stage { flex:1; height:auto; min-height:200px; }
}
</style>
</head>
<body>
<main>
<header><h1>Room Editor</h1><a href="./map-editor.html">Map Editor</a></header>
<div class="workspace">
<section class="tools" aria-labelledby="tools-title">
<h2 id="tools-title">Props</h2>
<label class="theme-pick">Theme <select id="theme" aria-describedby="theme-note"></select></label>
<p id="theme-note"></p>
<div class="palette" id="palette" role="group" aria-label="Room props"></div>
<p id="prop-info"></p>
<div class="toolbar">
<button id="rotate">Rotate 90°</button>
<button id="entrance" aria-pressed="false">Doorway</button>
<button id="erase" aria-pressed="false">Erase</button>
</div>
<div class="edit-actions" role="group" aria-label="Edit placed props">
<button id="select-item" aria-pressed="false">Select item</button>
<button id="move-item" disabled>Move</button>
<button id="rotate-item" disabled>Rotate selected</button>
</div>
<p id="status" role="status">Hover or tap a tile to preview a prop.</p>
</section>
<section class="map" aria-label="Room layout">
<div class="toolbar">
<input id="name" type="text" maxlength="80" aria-label="Room name" value="Untitled Room">
<button id="undo" disabled>Undo</button>
<button id="save-room">Save Room</button>
<button id="save-copy">Save as New Room</button>
<button id="save-test">Save &amp; Test</button>
<button id="save">Export JSON</button>
<label for="saved-room">My Rooms</label> <select id="saved-room"><option value="">Open a saved room</option></select>
<button id="open">Open JSON</button>
<button id="clear" disabled>Clear room</button>
<button id="toggle-preview" aria-controls="room-preview" aria-expanded="false">Show 3D preview</button>
<input id="file" type="file" accept=".json,application/json" hidden>
</div>
<div class="board" tabindex="0" aria-label="Scrollable 13 by 13 room">
<div id="grid" role="group" aria-label="Room tiles"></div>
</div>
</section>
<section class="map" id="room-preview" aria-labelledby="preview-title" hidden>
<h2 id="preview-title">3D Room Preview</h2>
<div class="toolbar" id="preview-controls" hidden>
<button id="preview-left" aria-label="Rotate view left">↶</button>
<button id="preview-right" aria-label="Rotate view right">↷</button>
<button id="preview-out">Zoom out</button>
<button id="preview-in">Zoom in</button>
<button id="preview-reset">Reset view</button>
</div>
<div id="preview-stage"><p id="preview-status" role="status">Loading 3D preview…</p></div>
</section>
</div>
</main>
<script>
'use strict';
const size=13;
const ROOM_LIBRARY_KEY='dungeon-room-library-v1';
const ROOM_SPECS={"full_stone":[1,"full",false,false],"half_wall":[1,"low",false,false],"window_wall":[2,"full",false,false],"wall_holes":[2,"full",false,false],"arched_entry":[3,"full",false,false],"corner_wall":[3,"full",false,false],"corner_half":[3,"low",false,false],"pillar":[1,"full",false,false],"broken-column":[1,"low",false,false],"armoire":[1,"full",false,false],"crate-stack":[1,"full",false,false],"barrel-cluster":[2,"full",false,false],"sarcophagus":[1,"full",false,false],"tapestry":[2,"soft",false,false],"banner":[1,"soft",false,false],"weapon-rack":[2,"full",false,false],"armor-rack":[1,"full",false,false],"iron-maiden":[1,"full",false,false],"wooden-cage":[1,"full",false,false],"rubble":[2,"low",false,false],"stalagmite":[1,"full",false,false],"barrel":[1,"low",false,false],"small-crate":[1,"low",false,false],"overturned-table":[2,"low",false,false],"altar":[2,"low",false,false],"pedestal":[1,"low",false,false],"chest":[1,"low",true,false],"trunk":[1,"low",true,false],"parapet":[2,"low",false,false],"bench":[2,"low",false,false],"cauldron":[1,"low",false,false],"unlit-brazier":[1,"low",false,false],"lit-brazier":[1,"low",false,true],"minecart":[2,"low",false,false],"handcart":[2,"low",false,false]};
function readRoomLibrary(){
  const stored=JSON.parse(localStorage.getItem(ROOM_LIBRARY_KEY)||'null');
  if(stored===null) return {rooms:[],test:null};
  if(!Array.isArray(stored.rooms)) throw new Error('Saved rooms could not be read.');
  return stored;
}
function playableRoom(data){
  if(data?.format!=='dungeon-room'||data.version!==1||data.width!==13||data.height!==13||
    typeof data.name!=='string'||data.name.length>80||!Array.isArray(data.props)||data.props.length>169||
    !Array.isArray(data.doorways)||data.doorways.length>48) throw new Error('Invalid room layout.');
  const marked=new Set();
  function reserve(x,y){
    const key=y*13+x;
    if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=13||y>=13||marked.has(key))
      throw new Error('A room item overlaps, or is outside the room.');
    marked.add(key);
  }
  const doorways=data.doorways.map(({x,y})=>{
    if(x!==0&&x!==12&&y!==0&&y!==12) throw new Error('Doorways belong on the room edge.');
    reserve(x,y);
    return {x,y};
  });
  const props=data.props.map(({type,x,y,rotation})=>{
    const corner=type==='corner_wall'||type==='corner_half';
    if(!Object.hasOwn(ROOM_SPECS,type)||!(corner?[0,90,180,270]:[0,90]).includes(rotation)) throw new Error('Invalid room prop.');
    const [span,cover,lootContainer,emitsLight]=ROOM_SPECS[type];
    if(corner){
      const [dx,dy]=[[1,1],[-1,1],[-1,-1],[1,-1]][rotation/90];
      reserve(x,y);reserve(x+dx,y);reserve(x,y+dy);
      return {type,x,y,rotation,width:2,height:2,cover,lootContainer,emitsLight};
    }
    for(let i=0;i<span;i++){
      const offset=i-(type==='arched_entry'?1:0);
      reserve(x+(rotation===0?offset:0),y+(rotation===90?offset:0));
    }
    return {type,x,y,rotation,width:rotation===0?span:1,height:rotation===90?span:1,cover,lootContainer,emitsLight};
  });
  return {format:'dungeon-room',version:1,width:13,height:13,name:data.name,doorways,props};
}

const WALL_TYPES={
  full_stone:{span:1,height:3,thickness:.4},
  half_wall:{span:1,height:3,thickness:.4,style:'half',top:1.05},
  window_wall:{span:2,height:3,thickness:.4,style:'window',openings:[[-.55,.55,1,2.1]]},
  wall_holes:{span:2,height:3,thickness:.4,style:'holes',openings:[[-.7,-.3,.45,1],[.2,.65,1.5,2.15]]},
  arched_entry:{span:3,height:3,thickness:.4,archWidth:1.8,archHeight:2.2}
};
// Solid pieces of a straight wall. Pieces marked see sit under an opening: they block walking but not sight.
function wallPieces(wall){
  const half=wall.span/2,top=wall.top??wall.height,out=[];
  let cursor=-half;
  for(const [x0,x1,y0,y1] of [...(wall.openings??[])].sort((a,b)=>a[0]-b[0])){
    if(x0>cursor) out.push({x0:cursor,x1:x0,y0:0,y1:top});
    out.push({x0,x1,y0:0,y1:y0,see:true});
    if(y1<top) out.push({x0,x1,y0:y1,y1:top});
    cursor=x1;
  }
  if(cursor<half) out.push({x0:cursor,x1:half,y0:0,y1:top});
  return out;
}

          else{ box(group,.04,.5,.015,0xb8bcc1,x,1.4,.08);box(group,.2,.04,.04,0x6b6e74,x,1.15,.08); }
        });
        cylinder(group,.22,.22,.04,0x8a3a38,.5,.55,.2).rotation.x=Math.PI/2;
      }else if(item.type==='armor-rack'){
        box(group,.7,.1,.5,wood,0,.05);
        box(group,.07,1.5,.07,wood,0,.8);
        box(group,.7,.07,.07,wood,0,1.35);
        box(group,.44,.55,.3,0x777c83,0,1.0);
        box(group,.34,.12,.26,0x5d6168,0,.66);
        for(const x of [-.28,.28]) mesh(group,new THREE.SphereGeometry(.13,8,6),material(0x8b9097),x,1.25,0);
        mesh(group,new THREE.SphereGeometry(.15,10,8),material(0x9aa0a6),0,1.55,0);
        box(group,.2,.03,.16,0x2b2d30,0,1.55,.06);
      }else if(item.type==='iron-maiden'){
        box(group,.62,1.6,.5,iron,0,.9);
        mesh(group,new THREE.CylinderGeometry(.22,.31,.4,8),material(0x666a72),0,1.8,0);
        box(group,.7,.1,.56,0x3e4146,0,.07);
        box(group,.03,1.5,.03,0x25272a,0,.9,.26);
        for(const [x,y] of [[-.15,.5],[.15,.5],[0,.85],[-.15,1.2],[.15,1.2]]) mesh(group,new THREE.ConeGeometry(.035,.14,5),material(0xb0b4ba),x,y,.34).rotation.x=Math.PI/2;
        box(group,.34,.07,.03,0x2a2c2f,0,1.8,.22);
      }else if(item.type==='wooden-cage'){
        box(group,.82,.08,.82,wood,0,.04);
        box(group,.82,.08,.82,wood,0,1.62);
        for(const x of [-.38,.38]) for(const z of [-.38,.38]) box(group,.07,1.6,.07,0x5d3e29,x,.84,z);
        for(let i=-2;i<=2;i++) for(const z of [-.38,.38]){
          box(group,.035,1.5,.035,iron,i*.15,.84,z);
          box(group,.035,1.5,.035,iron,z,.84,i*.15);
        }
        cylinder(group,.1,.1,.05,iron,0,1.7);
        mesh(group,new THREE.BoxGeometry(.24,.04,.14),material(0x4a4d53),.15,.1,.1);
      }else if(item.type==='rubble'){
        const shades=[0x7d7565,0x8b8171,0x6c6558,0x948a78];
        for(let i=0;i<11;i++){
          const s=.18+((i*37)%17)/50,x=-.8+((i*53)%160)/100,z=-.25+((i*29)%50)/100;
          const piece=mesh(group,new THREE.BoxGeometry(s*1.3,s,s*1.1),material(shades[i%4]),x,s/2+(i>7?.14:0),z);
          piece.rotation.set(((i*7)%5)*.12,i*.9,((i*3)%4)*.1);
        }
      }else if(item.type==='stalagmite'){
        for(const [x,z,r,h] of [[0,0,.26,1.5],[.28,.12,.16,.9],[-.26,.1,.14,.65],[.05,-.28,.11,.5]])
          mesh(group,new THREE.ConeGeometry(r,h,7),material(0x8f8878),x,h/2,z);
      }else if(item.type==='small-crate'){
        box(group,.62,.58,.62,wood,0,.3);
        for(const y of [.1,.5]) box(group,.66,.07,.66,0x6a4529,0,y);
        for(const x of [-.28,.28]) box(group,.06,.6,.66,0x6a4529,x,.3);
        box(group,.5,.04,.5,0xa06d47,0,.6);
      }else if(item.type==='overturned-table'){
        const top=box(group,1.7,.1,.82,0x8a5a39,0,.55,0);
        top.rotation.z=.9;top.position.x=-.35;
        for(const [x,z] of [[-.7,-.3],[-.7,.3]]){
          const leg=box(group,.1,.65,.1,wood,x,.3,z);
          leg.rotation.z=.9;leg.position.set(.28,.62,z);
        }
        box(group,.3,.02,.3,0x6b4a30,.2,.01,.3).rotation.y=.5;
      }else if(item.type==='altar'){
        box(group,1.7,.5,.6,stone,0,.25);
        box(group,1.9,.12,.74,0xa79a84,0,.56);
        box(group,1.5,.2,.5,0x7d7565,0,.72);
        for(const x of [-.6,.6]){
          cylinder(group,.05,.05,.28,0xe6dcc0,x,.96,0);
          mesh(group,new THREE.ConeGeometry(.04,.1,5),new THREE.MeshBasicMaterial({color:0xffb85c}),x,1.15,0);
        }
        box(group,.5,.03,.3,0x6a1f2a,0,.83);
      }else if(item.type==='minecart'){
        box(group,1.6,.12,.78,0x3f4247,0,.28);
        box(group,1.6,.5,.06,iron,0,.55,.37);
        box(group,1.6,.5,.06,iron,0,.55,-.37);
        for(const x of [-.78,.78]) box(group,.06,.5,.76,iron,x,.55);
        box(group,1.5,.04,.7,0x2a2c2f,0,.42);
        for(let i=0;i<7;i++) mesh(group,new THREE.DodecahedronGeometry(.14),material(i%2?0x8a6a2c:0x5d5b55),-.55+i*.18,.55+((i*7)%3)*.04,((i*5)%3-1)*.15);
        for(const x of [-.5,.5]) for(const z of [-.4,.4]) cylinder(group,.16,.16,.06,0x2d2f33,x,.17,z).rotation.x=Math.PI/2;
      }else if(item.type==='handcart'){
        box(group,1.3,.1,.74,wood,-.05,.42);
        box(group,1.3,.26,.05,0x6a4529,-.05,.58,.35);
        box(group,1.3,.26,.05,0x6a4529,-.05,.58,-.35);
        box(group,.05,.26,.74,0x6a4529,-.7,.58);
        for(const z of [-.42,.42]){ cylinder(group,.3,.3,.07,0x5d3e29,0,.3,z).rotation.x=Math.PI/2; cylinder(group,.05,.05,.1,iron,0,.3,z).rotation.x=Math.PI/2; }
        for(const z of [-.28,.28]) box(group,.9,.05,.05,wood,.75,.34,z).rotation.z=-.15;
        for(let i=0;i<3;i++) box(group,.34,.24,.3,0x9a7650,-.4+i*.1,.64+i*.01,(i-1)*.18).rotation.y=i*.35;
      }else if(item.type==='cauldron'){
        mesh(group,new THREE.SphereGeometry(.4,14,10),material(0x2c2e32),0,.52,0).scale.y=.8;
        mesh(group,new THREE.TorusGeometry(.33,.04,6,16),material(0x3d4045),0,.78,0).rotation.x=Math.PI/2;
        mesh(group,new THREE.CylinderGeometry(.28,.28,.03,14),material(0x4f7a3a),0,.74,0);
        for(const a of [0,2.1,4.2]) cylinder(group,.05,.04,.28,iron,Math.cos(a)*.24,.14,Math.sin(a)*.24);
      }else if(item.type==='crate-stack'){
        box(group,.78,.54,.75,wood);
        box(group,.58,.52,.58,0xa06d47,.05,.80,0);
      }else if(item.type==='chest'||item.type==='trunk'){
        box(group,.80,.47,.59,wood);
        const lid=box(group,.8,.08,.60,wood,0,item.type==='chest'?.71:.48,item.type==='chest'?-.22:0);
        if(item.type==='chest') lid.rotation.x=-1.14;
        box(group,.13,.13,.035,0xc29858,0,.30,.31);
      }else{
        const metal=/armor|maiden|minecart/.test(item.type);
        const masonry=/sarcophagus|rubble|stalagmite/.test(item.type);
        const height=kind==='full'?1.73:.68;
        box(group,span*.76,height,.68,masonry?stone:metal?iron:wood);
        box(group,span*.80,.10,.72,masonry?0xa09583:metal?0x777c83:0xa06d47,0,height-.05);
      }
      content.add(group);
    }
    let angle=Math.PI/4,pitch=.78,zoom=1;
    let lastItems,lastDoors,drawPending=false;
    function draw(){
      if(drawPending||previewPanel.hidden) return;
      drawPending=true;
      requestAnimationFrame(()=>{
        drawPending=false;
        if(previewPanel.hidden) return;
        const width=previewMount.clientWidth,height=previewMount.clientHeight;
        if(!width||!height) return;
        const aspect=width/height, frame=9.6/zoom;
        camera.left=-frame*Math.max(1,aspect);
        camera.right=-camera.left;
        camera.top=frame/Math.min(1,aspect);
        camera.bottom=-camera.top;
        camera.updateProjectionMatrix();
        camera.position.set(27*Math.sin(angle)*Math.cos(pitch),27*Math.sin(pitch),27*Math.cos(angle)*Math.cos(pitch));
        camera.lookAt(0,.5,0);
        renderer.setSize(width,height,false);
        renderer.render(scene,camera);
      });
    }
    themeChanged=()=>{
      for(const key of Object.keys(materials)) delete materials[key];
      floor.material=material(R(THEMES[roomTheme].floor));
      paintMasonry();stoneTexture.needsUpdate=true;
      lastItems=undefined;
      updateRoomPreview();
    };
    updateRoomPreview=()=>{
      if(lastItems!==items||lastDoors!==doors){
        for(const group of [...content.children]){
          group.traverse(object=>{
            object.geometry?.dispose();
            if(object.material?.isMeshBasicMaterial) object.material.dispose();
          });
          content.remove(group);
        }
        for(const item of items) addProp(item);
        for(const door of doors) box(content,.87,.025,.87,0x639474,door.x+.5-center,.014,door.y+.5-center);
        lastItems=items;
        lastDoors=doors;
      }
      draw();
    };
    let orbit;
    previewMount.onpointerdown=event=>{
      if(orbit||event.button!==0) return;
      orbit={id:event.pointerId,x:event.clientX,y:event.clientY};
      previewMount.setPointerCapture(event.pointerId);
    };
    previewMount.onpointermove=event=>{
      if(orbit?.id!==event.pointerId) return;
      angle-=(event.clientX-orbit.x)*.009;
      pitch=Math.max(.18,Math.min(1.5,pitch+(event.clientY-orbit.y)*.007));
      orbit.x=event.clientX;
      orbit.y=event.clientY;
      draw();
    };
    previewMount.onlostpointercapture=()=>{orbit=null;};
    byId('preview-left').onclick=()=>{angle-=Math.PI/6;draw();};
    byId('preview-right').onclick=()=>{angle+=Math.PI/6;draw();};
    byId('preview-in').onclick=()=>{zoom=Math.min(2.5,zoom+.2);draw();};
    byId('preview-out').onclick=()=>{zoom=Math.max(.6,zoom-.2);draw();};
    byId('preview-reset').onclick=()=>{angle=Math.PI/4;pitch=.78;zoom=1;draw();};
    new ResizeObserver(draw).observe(previewMount);
    previewStatus.hidden=true;
    byId('preview-controls').hidden=false;
    updateRoomPreview();
  }catch{
    previewStarted=false;
    previewStatus.textContent='3D preview unavailable. It requires an internet connection and WebGL.';
  }
}
const savedPicker=byId('saved-room');
function refreshSavedRooms(){
  try{
    const options=readRoomLibrary().rooms.map(record=>new Option(record.room.name,record.id));
    savedPicker.replaceChildren(new Option('Open a saved room',''),...options);
    savedPicker.value=savedRoomId??'';
  }catch{ say('My Rooms could not be loaded.'); }
}
function saveToLibrary({copy=false,test=false}={}){
  if(!name.value.trim()){say('Enter a room name first.');name.focus();return;}
  try{
    const room=encode();
    const normalized=playableRoom(room);
    if(test){
      const filled=normalized.props.filter(prop=>prop.cover!=='soft'&&prop.type!=='arched_entry')
        .reduce((count,prop)=>count+prop.width*prop.height,0);
      if(filled>=size*size) throw new Error('Leave an open floor tile for the player.');
    }
    const library=readRoomLibrary();
    const current=copy?null:library.rooms.find(record=>record.id===savedRoomId);
    const id=current?.id??crypto.randomUUID();
    const record={id,room};
    library.rooms=current?library.rooms.map(entry=>entry.id===id?record:entry):[...library.rooms,record];
    if(test) library.test=room;
    localStorage.setItem(ROOM_LIBRARY_KEY,JSON.stringify(library));
    savedRoomId=id;
    refreshSavedRooms();
    persist();
    say(test?'Test room saved. Opening the game…':room.name+' saved to My Rooms.');
    if(test){
      const opened=window.open('./?test-room=1','_blank');
      if(opened) opened.opener=null;
      else window.location.assign('./?test-room=1');
    }
  }catch(error){say('Could not save room. '+error.message);}
}
savedPicker.onchange=()=>{
  if(!savedPicker.value) return;
  try{
    const record=readRoomLibrary().rooms.find(entry=>entry.id===savedPicker.value);
    if(!record) throw new Error('The room is no longer available.');
    const room=decode(record.room);
    remember();
    apply(room);
    savedRoomId=record.id;
    persist();
    say(record.room.name+' opened. Undo restores the previous draft.');
  }catch(error){say(error.message);}
};
byId('save-room').onclick=()=>saveToLibrary();
byId('save-copy').onclick=()=>saveToLibrary({copy:true});
byId('save-test').onclick=()=>saveToLibrary({test:true});
addEventListener('storage',event=>{if(event.key===ROOM_LIBRARY_KEY) refreshSavedRooms();});
refreshSavedRooms();
let previewStarted=false;
byId('toggle-preview').onclick=()=>{
  previewPanel.hidden=!previewPanel.hidden;
  const button=byId('toggle-preview');
  button.setAttribute('aria-expanded',String(!previewPanel.hidden));
  button.textContent=previewPanel.hidden?'Show 3D preview':'Hide 3D preview';
  if(previewPanel.hidden) return;
  if(!previewStarted){
    previewStarted=true;
    previewStatus.textContent='Loading 3D preview…';
    startRoomPreview();
  }else updateRoomPreview();
};
setTheme(roomTheme,false);
themeReady=true;
updateTool();
render();
</script>
