<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.5D Test Dungeon</title>
<style>
:root { color-scheme: dark; font: 16px system-ui,sans-serif; background:#171613; color:#f4e6c9; }
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(ellipse at top,#30271e,transparent 70%); min-height:100vh; }
main { width:min(940px,100%); margin:auto; padding:clamp(12px,3vw,30px); }
header, .toolbar, .readout, .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; justify-content:space-between; }
h1 { font:bold clamp(24px,5vw,42px) Georgia,serif; margin:0; }
p { margin:8px 0; }
select { font:inherit; color:inherit; min-height:44px; background:#302922; border:1px solid #78664c; border-radius:6px; padding:6px; }
button { font:inherit; color:inherit; border:1px solid #78664c; border-radius:6px; background:#302922; padding:8px 12px; min-height:44px; cursor:pointer; touch-action:manipulation; }
button[aria-pressed=true], button:active { color:#1b1510; background:#e6b769; }
button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
.stage { position:relative; margin:12px 0 0; overflow:hidden; border:1px solid #78664c; border-radius:8px; background:#100e0c; }
canvas { display:block; width:100%; aspect-ratio:16/10; touch-action:none; }
.readout { color:#d3c4af; font-size:.9rem; }
#message { min-height:2.7em; }
.controls { justify-content:flex-start; }
.controls button { min-width:48px; touch-action:none; }
.hint { font-size:.9rem; color:#d3c4af; }
#guard-status { color: #a8d5a9; }
#guard-status.spotted { color: #ffba87; font-weight: 700; }
</style>
</head>
<body>
<main>
<header>
<h1>2.5D Test Dungeon</h1>
<div class="toolbar" role="group" aria-label="View">
<button id="map" aria-pressed="false">Top-down</button>
<button id="eye" aria-pressed="true">First-person</button>
</div>
</header>
<label for="location">Expedition</label> <select id="location"></select>
<span id="acid-comparison" hidden><label for="acid-finish">Acid chamber finish</label>
<select id="acid-finish"><option value="smooth">Smooth test</option><option value="original">Original</option></select></span>
<p id="objective"></p>
<div class="stage"><canvas id="view" width="480" height="300" aria-label="Dungeon game view"></canvas></div>
<div class="readout"><p id="position"></p><p id="inventory"></p><p id="guard-status" role="status"></p></div>
<p id="message" role="status"></p>
<div class="controls" aria-label="Game controls">
<button data-hold="q" aria-label="Turn left">↶</button>
<button data-hold="w" aria-label="Move forward">↑</button>
<button data-hold="s" aria-label="Move backward">↓</button>
<button data-hold="e" aria-label="Turn right">↷</button>
<button id="interact">Interact</button>
<button id="punch">Punch</button> <button id="weapon-toggle" disabled>Equip weapon</button> <button id="reload" disabled>Reload</button>
<button id="heal">Use bandage</button>
<button id="reset">New layout</button>
</div>
<p class="hint">WASD to move, Q/E or ←/→ to turn, F to interact, Space or left-click to use fists or weapon, G to equip or stow, R to reload, H to use a bandage, V to switch views. Drag the first-person view to look around.</p>
</main>
<script>
'use strict';

// Standalone layout code adapted from Stronghold Architect: dungeons.js (434bdd1), world.js (c840d8a), and room definitions.
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const GRID=30;
const TYPES=[
['Throne Room',0,0,0,[],'The heart of your keep. Produces 20 gold and 12 stone daily.'],
['Barracks',50,25,0,[],'Recruit guards. Each Barracks level unlocks one slot, up to five.'],
['Kitchen',40,20,0,[],'Produces 0.5 food every 60 real seconds. Allows more servants: Level 1 adds 1, Level 3 adds 2 in total, Level 5 adds 4 in total.'],
['Armory',65,35,0,[1],'Produces 10 stone daily and adds opening block equal to 3% of max HP per room level for the prince and guards.'],
['War Room',75,35,0,[1,3],'Adds 3% attack damage per room level for the prince and guards.'],
['Library',60,30,0,[],'Produces 5 research points daily. Research Monster Lair, Puzzle Room, and Arcane Lab here.'],
['Chapel',65,35,0,[2],'Recruit one Paladin per Chapel, armed with a long bastard sword.'],
['Monster Lair',85,40,0,[5,11],'Research and recruit monster companions. Up to three Lairs.'],
['Puzzle Room',80,45,0,[5,11],'Open optional treasure doors in rival keeps and dungeons. One per keep.'],
['Arcane Lab',100,50,0,[5],'Craft single-use runes. Upgrade the Lab to unlock more recipes.'],
['Vault',90,45,0,[3,4],'Produces 35 gold daily.'],
['Trap Room',45,25,0,[],'Your trap workshop. Build at least one Trap Room to install or upgrade traps in Empty Rooms. Traps trigger in the room where they are installed.'],
['Straight Hall',0,5,0,[],'Connects north and south.'],
['Turn Hall',0,5,0,[],'Connects north and east.'],
['T Junction',0,8,0,[],'Connects north, east, and west.'],
['Crossroads',0,10,0,[],'Connects all four directions.'],
['Empty Room',20,10,0,[],'Assign a servant, leave this room clear for the throne, or install one trap after building a Trap Room.'],
['Entrance',0,0,0,[],'Castle gate at the southern edge. Build only inward above it; the immediate left, right, and below are reserved. Cannot be duplicated, rotated, or demolished.'],
['Gold Mine',60,30,0,[],'Produces 25 gold daily.'],
['Research Room',60,30,0,[],'Produces 10 research points daily. Spend them to permanently unlock room blueprints.']
];


function exits(t){const d=t.ports|| (t.type===17?[0]:t.type===12?[0,2]:t.type===13?[0,1]:t.type===14?[0,1,3]:[0,1,2,3]);return d.map(n=>(n+t.rot)%4)}
function at(x,y,tiles){return tiles.find(t=>t.x===x&&t.y===y)}
function compatible(a,b,d){return exits(a).includes(d)&&exits(b).includes((d+2)%4)}
function entranceBlocked(x,y,tiles){const entrance=tiles.find(t=>t.type===17);return !!entrance&&((y===entrance.y&&Math.abs(x-entrance.x)===1)||(x===entrance.x&&y===entrance.y+1))}
function blocksHallDoor(a,b,d){const opposite=(d+2)%4,ao=exits(a).includes(d),bo=exits(b).includes(opposite);return (a.type>=12&&a.type<=15&&ao&&!bo)||(b.type>=12&&b.type<=15&&bo&&!ao)}
function placement(t,tiles){if(entranceBlocked(t.x,t.y,tiles))return false;let joins=0;for(let d=0;d<4;d++){const b=at(t.x+DIRS[d][0],t.y+DIRS[d][1],tiles);if(b){if(blocksHallDoor(t,b,d))return false;if(compatible(t,b,d))joins++}}return joins>0}
function roomKey(room){return room.x+','+room.y}
function prereqsMet(type,tiles){return TYPES[type][4].every(r=>tiles.some(t=>t.type===r))}
const DUNGEON_GRID_SIZE=10;
const DUNGEON_LAYOUT_VERSION=5;
const DUNGEON_ROOM_ART={
 'ruined-storage':'Ruined Storage','dark-cell':'Dark Cell','cave-room':'Cave Room',
 'old-throne-room':'Old Throne Room','old-vault':'Old Vault','old-kitchen':'Old Kitchen',
 'ruined-library':'Ruined Library','armory':'Dungeon Armory','crypt':'Crypt',
 'flooded-chamber':'Flooded Chamber','alchemy-lab':'Alchemy Lab','torture-chamber':'Torture Chamber',
 'chapel':'Dungeon Chapel','barracks':'Dungeon Barracks','collapsed-hall':'Collapsed Hall',
 'straight-hall':'Straight Hall','turn-hall':'Turn Hall','crossroads-1':'Crossroads',
 'crossroads-2':'Crossroads','rune-sanctum':'Rune Sanctum'
};
const DUNGEON_INTERIOR_ART=[
 'ruined-storage','dark-cell','cave-room','old-throne-room','old-kitchen','ruined-library','armory',
 'crypt','flooded-chamber','alchemy-lab','chapel','barracks','collapsed-hall','rune-sanctum'
];

const DUNGEON_TIERS=[
  {id:'dungeon-low',name:'Forgotten Cellar',crateCount:3,occupancy:.3,rooms:[2,3,16,18]},
  {id:'dungeon-medium',name:'Buried Keep',crateCount:5,occupancy:.6,rooms:[3,5,6,8,19]},
  {id:'dungeon-high',name:'Hollow Citadel',crateCount:8,occupancy:.9,rooms:[3,4,7,9,18,19]}
];


function generateDungeon(tier){
 const index=DUNGEON_TIERS.indexOf(tier),roll=n=>Math.floor(Math.random()*n);
 const pick=list=>list[roll(list.length)];
 const side=DUNGEON_GRID_SIZE,total=Math.round(side*side*tier.occupancy);
 const entrance={x:2+roll(side-4),y:side-1,type:17,rot:0,level:1,ports:[0]};
 const first={x:entrance.x,y:entrance.y-1,rot:0,level:1,ports:[2],depth:1};
 const rooms=[first],tiles=[entrance,first],occupied=new Set(tiles.map(roomKey)),frontier=[];
 const addFrontier=parent=>{
  DIRS.forEach(([dx,dy],direction)=>{
   const x=parent.x+dx,y=parent.y+dy;
   if(x>=0&&x<side&&y>=0&&y<side&&!occupied.has(roomKey({x,y})))frontier.push({parent,x,y,direction});
  });
 };
 addFrontier(first);
 while(tiles.length<total){
  const index=roll(frontier.length),edge=frontier[index];
  frontier[index]=frontier[frontier.length-1];frontier.pop();
  if(occupied.has(roomKey(edge)))continue;
  const {x,y,parent,direction}=edge;
  const room={x,y,rot:0,level:1,ports:[(direction+2)%4],depth:parent.depth+1};
  parent.ports.push(direction);
  tiles.push(room);rooms.push(room);occupied.add(roomKey(room));
  addFrontier(room);
 }
 // A leaf keeps the vault from blocking access to any other room.
 const deepest=Math.max(...rooms.map(room=>room.depth));
 const vault=pick(rooms.filter(room=>room.depth===deepest));
 const vaultKey=roomKey(vault);
 vault.type=10;
 const sideRooms=rooms.filter(room=>room!==vault);
 for(const room of sideRooms) room.type=pick(tier.rooms);
 const specialPool=sideRooms.filter(room=>room!==first);
 const junctions=specialPool.filter(room=>room.ports.length>=2);
 const halls=[];
 while(halls.length<Math.ceil(total*.2)){
  const [room]=junctions.splice(roll(junctions.length),1);
  halls.push(room);
  const ports=room.ports;
  room.type=ports.length===4?15:ports.length===3?14:ports.includes((ports[0]+2)%4)?12:13;
  if(room.type===12)room.rot=ports[0]%2;
  if(room.type===13)room.rot=ports.find(port=>ports.includes((port+1)%4));
  if(room.type===14)room.rot=(DIRS.findIndex((_,i)=>!ports.includes(i))+2)%4;
 }
 const trapPool=specialPool.filter(room=>![12,13,14,15].includes(room.type)), dungeonTraps=['spikes','gas','flame','acid'];
 for(let count=Math.ceil(total*.1);count>0;count--){
  const [room]=trapPool.splice(roll(trapPool.length),1);
  room.type=11;
  room.dungeonTrap=dungeonTraps[roll(index<2?index+2:4)];
 }
 for(const room of rooms){
  delete room.depth;
  // The generator tracks world-facing connections. Tile ports are stored before rotation.
  room.ports=room.ports.map(port=>(port-room.rot+4)%4);
  if(room===vault)room.dungeonArt='old-vault';
  else if(room.type===11)room.dungeonArt='torture-chamber';
  else if(room.type===12)room.dungeonArt='straight-hall';
  else if(room.type===13)room.dungeonArt='turn-hall';
  else if(room.type===15)room.dungeonArt=pick(['crossroads-1','crossroads-2']);
  else if(room.type!==14)room.dungeonArt=pick(DUNGEON_INTERIOR_ART);
 }
 const crateRooms=new Set([roomKey(first),vaultKey]);
 const candidates=sideRooms.filter(t=>t!==first&&!(t.type>=12&&t.type<=15));
 while(crateRooms.size<tier.crateCount+3 && candidates.length){
   const [t]=candidates.splice(roll(candidates.length),1);
   crateRooms.add(roomKey(t));
 }
 return {rulingName:tier.name,tiles,vaultKey,crateRooms};
}


const NAMES=["House Ashford", "House Blackthorn", "House Ravenshield", "House Ironwood", "House Valemont", "House Greywatch", "House Thornwick", "House Stormholt", "House Fairbourne", "House Embercrest", "House Wintermere", "House Goldwyck", "House Dunraven", "House Highmere", "House Redwyne", "House Stonehart", "House Wyrmwood", "House Silverbrook", "House Oakenshield", "House Nightford", "Clan Frosthelm", "Clan Wolfhearth", "Clan Stagmoor", "Clan Brackenfell", "House Kingsward", "House Bellgrave", "House Whitestone", "House Hawkridge", "The Iron Covenant", "The Order of Dawn"];
const ri=n=>Math.floor(Math.random()*n);
const EXTRA=[2,5,18,19,16,1];
function layout(){
 const col=8+ri(8),tiles=[{x:col,y:23,type:17,rot:0,level:1},{x:col,y:22,type:15,rot:0,level:1},{x:col,y:21,type:16,rot:0,level:1},{x:col,y:20,type:0,rot:0,level:1}];
 const want=2+ri(4);let tries=0,barracks=false;
 while(tiles.length<4+want&&tries++<200){
  const base=tiles[ri(tiles.length)];if(base.type===0||base.type===17)continue;
  const d=ri(4),x=base.x+DIRS[d][0],y=base.y+DIRS[d][1];
  if(x<1||y<1||x>GRID-7||y>22||tiles.some(t=>t.x===x&&t.y===y))continue;
  if(tiles.some(t=>t.type===0&&Math.abs(t.x-x)+Math.abs(t.y-y)<=1))continue;
  let type=EXTRA[ri(EXTRA.length)];if(type===1&&barracks)continue;
  if(type!==16&&type!==1&&!prereqsMet(type,tiles))continue;
  const nt={x,y,type,rot:0,level:1};if(!placement(nt,tiles))continue;
  if(type===1)barracks=true;tiles.push(nt);
 }
 if(barracks&&!tiles.some(t=>t.type===3)&&Math.random()<.6){for(let k=0;k<40;k++){const b=tiles[ri(tiles.length)];if(b.type===0||b.type===17)continue;const d=ri(4),x=b.x+DIRS[d][0],y=b.y+DIRS[d][1];if(x<1||y<1||x>GRID-7||y>22||tiles.some(t=>t.x===x&&t.y===y)||tiles.some(t=>t.type===0&&Math.abs(t.x-x)+Math.abs(t.y-y)<=1))continue;const nt={x,y,type:3,rot:0,level:1};if(placement(nt,tiles)){tiles.push(nt);break}}}
 return tiles;
}


function rival(){
  return {rulingName:NAMES[ri(NAMES.length)],tiles:layout()};
}

const ROOM_SIZE=13, ROOM_SPACING=ROOM_SIZE+1;
const ROOM_LEFT=Math.floor(ROOM_SIZE/2), ROOM_RIGHT=ROOM_SIZE-ROOM_LEFT;
const ARCH_WIDTH=1, ARCH_HALF=ARCH_WIDTH/2;
const ARCH_LEFT=Math.floor(ARCH_HALF), ARCH_RIGHT=ARCH_WIDTH-ARCH_LEFT;
const ROOM_CENTER=ROOM_LEFT+1;
const EYE_HEIGHT=.5;
const CEILING_HEIGHT=1.3;
let room,rooms,roomThemes,pillars,arches,mapLayers,actors,ceilingLights,site,health,bandages,defeated,recoveredCache,turn;
const canvas = document.querySelector('#view');
const desktop=globalThis.matchMedia?.('(min-width: 900px) and (pointer: fine)').matches;
if(desktop){ canvas.width=640; canvas.height=400; }
const ctx = canvas.getContext('2d');
const width = canvas.width, height = canvas.height, horizon = height / 2;
const focal = width / (2 * Math.tan(Math.PI / 5));
const depth = new Float32Array(width);
const planes = ctx.createImageData(width, height);
const buttons = [...document.querySelectorAll('[data-hold]')];
const keys = new Set();
const held = new Map();
const player = {};
let mode = 'eye', escaped, drag, roomLights, smoothAcid=true;
const byId = id => document.getElementById(id);
const tell = message => { byId('message').textContent = message; };
const locationSelect = byId('location');
for (const tier of DUNGEON_TIERS) locationSelect.add(new Option(tier.name,tier.id));
locationSelect.add(new Option('Rival Stronghold','rival'));
locationSelect.add(new Option('Acid Chamber Field Test','acid-test'));
const finishSelect=byId('acid-finish');
finishSelect.onchange=()=>{
  smoothAcid=finishSelect.value==='smooth';
  turn++;
};

// Room art IDs come from Stronghold Architect. Each style supplies both views.
const ROOM_STYLES={
  stone:['#625e59','#777069','bench'], hall:['#635f58','#82786c',null],
  entrance:['#635c54','#807465','banner'], storage:['#65574a','#756351','barrels'],
  cell:['#53565c','#6e6d72','cage'], cave:['#56564c','#666552','rubble'],
  throne:['#665153','#786564','throne'], vault:['#665d48','#88775d',null],
  kitchen:['#705a48','#85674d','hearth'], library:['#594d49','#776459','books'],
  armory:['#575b60','#70757b','weapons'], war:['#644e49','#80665d','desk'], crypt:['#575963','#74747d','sarcophagus'],
  flooded:['#46606a','#63737a','pool'], arcane:['#564d65','#73647a','altar'],
  torture:['#62514c','#7c6861','rack'], chapel:['#62616a','#807784','shrine'],
  barracks:['#62584e','#7b6b5f','bunks'], mine:['#625c4a','#81745f','ore'],
  research:['#5b5953','#766d60','desk'], acid:['#444851','#797167',null],
  spikes:['#54535b','#776d6b','spikes'], gas:['#515a48','#75816b','vents'],
  flame:['#694c43','#8b6c5c','brazier']
};
const ART_STYLE={
  'ruined-storage':'storage','dark-cell':'cell','cave-room':'cave','old-throne-room':'throne',
  'old-vault':'vault','old-kitchen':'kitchen','ruined-library':'library',armory:'armory',
  crypt:'crypt','flooded-chamber':'flooded','alchemy-lab':'arcane','torture-chamber':'torture',
  chapel:'chapel',barracks:'barracks','collapsed-hall':'cave','rune-sanctum':'arcane'
};
const TYPE_STYLE=['throne','barracks','kitchen','armory','war','library','chapel','cave',
  'arcane','arcane','vault','torture','hall','hall','hall','hall','stone','entrance','mine','research'];
function themeAt(x,y){
  return roomThemes[Math.floor(y/ROOM_SPACING)]?.[Math.floor(x/ROOM_SPACING)] ?? themes.stone;
}
function decorateRoom(theme,x,y){
  if(theme.id==='acid'){
    for(const [dx,dy] of [[-2,-2],[2,-2],[0,0],[-2,2],[2,2]]){
      actors.push({kind:'pillar',x:x+dx,y:y+dy,radius:.73,height:CEILING_HEIGHT});
      actors.push({kind:'spores',x:x+dx+.52,y:y+dy+.53,height:.61,lift:.12});
    }
  } else if(theme.prop){
    const low=['pool','spikes','rubble','vents'].includes(theme.prop);
    actors.push({kind:'furnishing',art:theme.prop,x:x-3.8,y:y+3.65,
      height:low?.2:.87,radius:low?0:.33});
  }
}

const WEAPONS={
  pistol:{name:'Pistol',capacity:12,reserve:36,interval:.27,kick:8,flash:5,length:47,color:'#505461'},
  shotgun:{name:'Shotgun',capacity:6,reserve:18,interval:.7,kick:19,flash:9,length:111,color:'#554739'},
  ar15:{name:'AR-15',capacity:30,reserve:60,interval:.18,kick:10,flash:7,length:105,color:'#555d63'},
  ak47:{name:'AK-47',capacity:30,reserve:60,interval:.22,kick:13,flash:8,length:119,color:'#69503c'},
  smg:{name:'SMG',capacity:25,reserve:75,interval:.14,kick:7,flash:6,length:77,color:'#434b50'}
};
let carriedWeapon=null, weaponEquipped=false, shotTime=0, reloadTime=0, shotImpact=null;
const RELOAD_SECONDS=1.15;
function activeWeapon(){ return weaponEquipped ? carriedWeapon : null; }
function clearWeaponAction(){ shotTime=reloadTime=0; shotImpact=null; }
function stockChests(spawn){
  const chests=actors.filter(a=>a.kind==='crate');
  const ids=Object.keys(WEAPONS);
  // Small strongholds may need extra chests in the entrance.
  const extraPositions=[[-3,-3],[3,-3],[-3,3],[3,3],[0,-4]];
  while(chests.length<ids.length){
    const [dx,dy]=extraPositions.shift();
    const chest={kind:'crate',x:spawn.x+dx,y:spawn.y+dy,height:.38,radius:.34,bandages:1};
    actors.push(chest);chests.push(chest);
  }
  ids.forEach((id,i)=>{ chests[Math.round(i*(chests.length-1)/(ids.length-1))].weapon=id; });
}

function takeWeapon(item){
  const previous=carriedWeapon;
  if(previous){
    // Swapping at the pickup's position keeps the old weapon on walkable ground.
    actors.push({kind:'weapon',x:item.x,y:item.y,height:.29,...previous});
  }
  carriedWeapon={id:item.id,ammo:item.ammo,reserve:item.reserve};
  item.done=true;
  weaponEquipped=true;
  clearWeaponAction();
  viewmodel=new ViewmodelCombat25D();
  const name=WEAPONS[item.id].name;
  tell(previous ? `Equipped ${name}. Dropped ${WEAPONS[previous.id].name}.` : `Equipped ${name}. Press G for fists or R to reload.`);
}
function toggleWeapon(){
  if(!carriedWeapon||escaped||defeated) return;
  weaponEquipped=!weaponEquipped;
  clearWeaponAction();
  viewmodel=new ViewmodelCombat25D();
  turn++;
  tell(weaponEquipped?`Equipped ${WEAPONS[carriedWeapon.id].name}.`:'Weapon stowed. Fists ready.');
}
function reloadWeapon(){
  const item=activeWeapon();
  if(!item||escaped||defeated||reloadTime>0||item.ammo>=WEAPONS[item.id].capacity) return;
  if(!item.reserve){ tell('No spare ammunition.');return; }
  reloadTime=RELOAD_SECONDS;
  turn++;
}
function fireWeapon(){
  const item=activeWeapon();
  if(shotTime>0||reloadTime>0) return;
  if(!item.ammo){ tell('Empty. Press R to reload.');return; }
  item.ammo--;
  shotTime=WEAPONS[item.id].interval;
  const dx=Math.cos(player.angle),dy=Math.sin(player.angle),wall=cast(dx,dy);
  const obstacle=tracePillar(dx,dy,pillars,wall.distance)?.distance ?? wall.distance;
  const distance=hitGuard(dx,dy,obstacle,GUARD_DAMAGE[item.id])?.distance ?? obstacle;
  shotImpact={x:player.x+dx*distance,y:player.y+dy*distance,age:0};
  turn++;
}
function updateWeapon(dt){
  shotTime=Math.max(0,shotTime-dt);
  if(shotImpact){
    shotImpact.age+=dt;
    if(shotImpact.age>=.18) shotImpact=null;
  }
  if(reloadTime===0) return;
  reloadTime=Math.max(0,reloadTime-dt);
  if(reloadTime>0) return;
  const item=activeWeapon();
  if(!item) return;
  const amount=Math.min(WEAPONS[item.id].capacity-item.ammo,item.reserve);
  item.ammo+=amount;
  item.reserve-=amount;
  turn++;
}

function restart() {
  const fieldTest=locationSelect.value==='acid-test';
  site=DUNGEON_TIERS.find(tier=>tier.id===(fieldTest?'dungeon-high':locationSelect.value));
  byId('acid-comparison').hidden=!fieldTest;
  const layout = site ? generateDungeon(site) : rival();
  const grid = new Map(layout.tiles.map(tile => [roomKey(tile),tile]));
  const originX = Math.min(...layout.tiles.map(t=>t.x));
  const originY = Math.min(...layout.tiles.map(t=>t.y));
  const cols=(Math.max(...layout.tiles.map(t=>t.x))-originX+1)*ROOM_SPACING;
  const rows=(Math.max(...layout.tiles.map(t=>t.y))-originY+1)*ROOM_SPACING;
  room=Array.from({length:rows},()=>Array(cols).fill('#'));
  rooms=new Map();
  roomThemes=Array.from({length:Math.ceil(rows/ROOM_SPACING)},()=>[]);
  arches=new Map();
  mapLayers=new Map();
  actors=[];
  ceilingLights=[];
  const vaultKey=layout.vaultKey ?? roomKey(layout.tiles.find(t=>t.type===0));
  if(site?.id==='dungeon-high' && !layout.tiles.some(t=>t.dungeonTrap==='acid')){
    const trap=layout.tiles.find(t=>t.dungeonTrap);
    if(trap) trap.dungeonTrap='acid';
  }
  const entrance=layout.tiles.find(t=>t.type===17);
  const center=t=>({x:(t.x-originX)*ROOM_SPACING+ROOM_CENTER+.5,y:(t.y-originY)*ROOM_SPACING+ROOM_CENTER+.5});
  for (const t of layout.tiles) {
    const key=roomKey(t), {x,y}=center(t), cx=Math.floor(x), cy=Math.floor(y);
    const hall=t.type>=12 && t.type<=15;
    const trapName=t.dungeonTrap ?? (!site && t.type===16 && t.y===entrance.y-2 ? 'spikes' : null);
    const style=trapName ?? (hall?'hall':ART_STYLE[t.dungeonArt] ?? TYPE_STYLE[t.type]);
    const theme=themes[style] ?? themes.stone;
    roomThemes[t.y-originY][t.x-originX]=theme;
    const roomName=theme.id==='acid' ? 'Acid Trap Chamber' : hall ? TYPES[t.type][0] : (DUNGEON_ROOM_ART[t.dungeonArt] ?? TYPES[t.type][0]);
    rooms.set(roomKey({x:cx,y:cy}),roomName);
    const n=hall ? ARCH_LEFT : ROOM_LEFT;
    const end=hall ? ARCH_RIGHT : ROOM_RIGHT;
    for(let dy=-n;dy<end;dy++) for(let dx=-n;dx<end;dx++) room[cy+dy][cx+dx]='.';
    for(const [d,[dx,dy]] of DIRS.entries()){
      const neighbor=grid.get(roomKey({x:t.x+dx,y:t.y+dy}));
      if(!neighbor || !compatible(t,neighbor,d)) continue;
      const boundary=dx+dy>0 ? ROOM_RIGHT : ROOM_LEFT+1;
      if(hall){
        for(let step=1;step<boundary;step++) for(let lane=-ARCH_LEFT;lane<ARCH_RIGHT;lane++){
          room[cy+dy*step+Math.abs(dx)*lane][cx+dx*step+Math.abs(dy)*lane]='.';
        }
      }
      const archX=cx+dx*boundary, archY=cy+dy*boundary;
      if(arches.has(cellKey(archX,archY))) continue;
      const arch={axis:dx ? 'x' : 'y',x:archX+.5,y:archY+.5};
      for(let lane=-ARCH_LEFT;lane<ARCH_RIGHT;lane++){
        const col=archX+Math.abs(dy)*lane;
        const rowIndex=archY+Math.abs(dx)*lane;
        room[rowIndex][col]='A';
        arches.set(cellKey(col,rowIndex),arch);
      }
    }

    if(layout.crateRooms?.has(key) || (!site && !hall && t!==entrance)){
      const inset=ROOM_RIGHT-1;
      actors.push({kind:'crate',x:x+inset,y:y+inset,height:.38,radius:.34,
        bandages:key===vaultKey?2:1,mainCache:key===vaultKey});
    }
    if(trapName){
      actors.push({kind:'trap',name:trapName,x,y,height:.06});
    }
    decorateRoom(theme,x,y);
    if(hall){
      const alongX=!exits(t).some(direction=>direction%2===0);
      ceilingLights.push({x,y,halfWidth:alongX?.99:.18,halfLength:alongX?.18:.99});
    } else {
      for(const offset of [-3,3]) ceilingLights.push({x:x+offset,y,halfWidth:.18,halfLength:1.25});
    }

  }
  // Mark a single layer of masonry around walkable space. The rest is map void.
  for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++) {
    if(room[y][x]!=='#') continue;
    if(DIRS.some(([dx,dy])=>['.','A'].includes(room[y+dy][x+dx]))) room[y][x]='W';
  }
  const spawn=center(entrance);
  Object.assign(player,{x:spawn.x,y:spawn.y+.55,angle:-Math.PI/2});
  actors.push({kind:'exit',x:spawn.x,y:spawn.y+1.7,height:.67});
  if(fieldTest){
    const acid=actors.find(a=>a.kind==='trap'&&a.name==='acid');
    Object.assign(player,{x:acid.x,y:acid.y+4.6,angle:-Math.PI/2});
  }
  carriedWeapon=null;
  weaponEquipped=false;
  clearWeaponAction();
  stockChests(spawn);
  pillars=actors.filter(a=>a.kind==='pillar');
  roomLights=roomThemes.map((row,y)=>row.map((_,x)=>bakeRoomLight(x*ROOM_SPACING,y*ROOM_SPACING)));
  health=100;
  bandages=0;
  escaped=defeated=recoveredCache=false;
  viewmodel=new ViewmodelCombat25D();
  turn=0;
  startGuard();
  lastRender=undefined;
  byId('objective').textContent=fieldTest ? 'Acid Chamber · Compare the original and smooth finishes from the same spot.' :
    `${layout.rulingName} · Recover the main supply crate and return to the entrance.`;
  if(fieldTest) tell('Walk around the pillars and look toward the ceiling lights. Use Acid chamber finish to compare materials.');
  else tell('Use F to open chests and pick up weapons. Press H to use a bandage.');
}

function targetActor(kinds,range=1.65,requireFacing=true) {
  return actors.filter(a=>!a.done && kinds.includes(a.kind)).map(a=>{
    const dx=a.x-player.x,dy=a.y-player.y;
    return {a,dx,dy,d:Math.hypot(dx,dy)};
  }).filter(({a,dx,dy,d})=>d<=range && (d<.01 ||
    ((!requireFacing || mode==='map' || (Math.cos(player.angle)*dx+Math.sin(player.angle)*dy)/d>.45) && cast(dx,dy).distance>=1 && !tracePillar(dx,dy,pillars,1))
  )).sort((a,b)=>a.d-b.d)[0]?.a;
}

function interact() {
  if(escaped || defeated) return;
  const a=targetActor(['crate','exit','weapon']);
  switch(a?.kind){
    case 'weapon':
      takeWeapon(a);
      break;
    case 'crate': {
      bandages+=a.bandages;
      a.done=true;
      if(a.mainCache) recoveredCache=true;
      const found=a.bandages===1?'1 bandage':`${a.bandages} bandages`;
      if(a.weapon){
        const spec=WEAPONS[a.weapon];
        actors.push({kind:'weapon',x:a.x,y:a.y,height:.29,lift:.40,
          id:a.weapon,ammo:spec.capacity,reserve:spec.reserve});
        tell(`Collected ${found}. Press F again to equip the ${spec.name}.`);
      } else {
        tell(a.mainCache?`Main supplies recovered: ${found}. Return to the entrance.`:`Collected ${found}.`);
      }
      break;
    }
    case 'exit':
      escaped=true;
      tell(recoveredCache ? 'Expedition complete. You recovered the main supplies.' : 'You withdrew safely.');
      break;
    default:
      tell('Move closer to a crate, weapon, or the entrance marker.');
  }
  turn++;
}

function hurt(damage) {
  health=Math.max(0,health-damage);
  if (!health) {
    defeated=true;
    tell('You were defeated. Restart to try a new layout.');
  }
}

function heal(){
  if(escaped || defeated) return;
  if (!bandages || health===100){ tell(bandages?'Your health is already full.':'No bandages remain.'); return; }
  bandages--;
  health=Math.min(100,health+45);
  turn++;
  tell(`Used a bandage. Health is now ${health}/100.`);
}
function triggerTraps(){
  const trap=actors.find(a=>a.kind==='trap'&&!a.done && Math.abs(a.x-player.x)<1.45 && Math.abs(a.y-player.y)<1.45);
  if(!trap) return;
  trap.done=true;
  turn++;
  const damage={spikes:8,gas:10,flame:13,acid:15}[trap.name];
  tell(`A ${trap.name} trap triggered. Took ${damage} damage.`);
  hurt(damage);
}
function cellKey(x,y) { return y*room[0].length+x; }
function tile(x,y) {
  return room[y]?.[x] ?? '#';
}
function solid(x,y) {
  const cell = tile(x,y);
  return cell === '#' || cell === 'W' || cell === 'B';
}
function canStand(x,y) {
  const r = 0.17;
  for (let row = Math.floor(y-r); row <= Math.floor(y+r); row++) {
    for (let col = Math.floor(x-r); col <= Math.floor(x+r); col++) {
      if (solid(col,row)) return false;
    }
  }
  return !actors.some(a => (!a.done || a.kind==='crate') && a.radius && Math.hypot(a.x-x,a.y-y)<a.radius+r);
}

// Grid traversal returns perpendicular depth when given a camera-plane ray.
function cast(dx,dy,openings,origin=player) {
  let x = Math.floor(origin.x), y = Math.floor(origin.y);
  const stepX = dx < 0 ? -1 : 1, stepY = dy < 0 ? -1 : 1;
  const deltaX = dx === 0 ? Infinity : Math.abs(1/dx);
  const deltaY = dy === 0 ? Infinity : Math.abs(1/dy);
  let nextX = dx === 0 ? Infinity : (dx < 0 ? origin.x-x : x+1-origin.x)*deltaX;
  let nextY = dy === 0 ? Infinity : (dy < 0 ? origin.y-y : y+1-origin.y)*deltaY;
  let distance, side;
  do {
    side = nextX < nextY ? 'x' : 'y';
    if (side === 'x') { distance = nextX; nextX += deltaX; x += stepX; }
    else { distance = nextY; nextY += deltaY; y += stepY; }
    if(openings && tile(x,y)==='A'){
      const arch=arches.get(cellKey(x,y));
      if(arch.axis===side){
        const lateral=side==='x' ? origin.y+dy*distance-arch.y : origin.x+dx*distance-arch.x;
        openings.push({arch,distance,lateral});
      }
    }
  } while (!solid(x,y));
  const crossing = side === 'x' ? origin.y+dy*distance : origin.x+dx*distance;
  return { x, y, distance, u: crossing-Math.floor(crossing), side };
}
function surface(w,h,paint) {
  const image = document.createElement('canvas');
  image.width = w;
  image.height = h;
  const g = image.getContext('2d');
  const rect = (color,x,y,width,height) => { g.fillStyle = color; g.fillRect(x,y,width,height); };
  paint(rect,g);
  return image;
}
function stone(base, mortar) {
  return surface(64,64,(rect) => {
    rect(mortar,0,0,64,64);
    for (let row=0; row<4; row++) {
      for (let col=-1; col<4; col++) {
        const x=col*22+(row%2)*11, y=row*16;
        const shade=base+((row*19+(col+1)*13)%15);
        rect(`rgb(${shade+9},${shade+2},${shade-5})`,x+1,y+1,21,14);
        rect(`rgba(255,220,175,.17)`,x+1,y+1,21,1);
      }
    }
    for (let i=0; i<280; i++) rect(i%2?'#0002':'#fff2',(i*37)%64,(i*57+Math.floor(i/8)*5)%64,1+i%2,1);
  });
}

function paintedWall(design){
  let state=design.id*9973;
  const random=()=> {
    state=(Math.imul(state,1664525)+1013904223)>>>0;
    return state/4294967296;
  };
  const color=(amount)=>`rgb(${design.base.map(channel=>Math.max(0,Math.min(255,Math.round(channel+amount)))).join(',')})`;
  const size=WALL_TEXTURE_SIZE;
  return surface(size,size,(rect,g)=>{
    rect(design.mortar,0,0,size,size);
    const block=(x,y,w,h,radius)=>{
      g.fillStyle=color((random()-.5)*34);
      g.beginPath();
      g.roundRect(x+1,y+1,w-2,h-2,radius);
      g.fill();
      rect('#fff3',x+radius+1,y+2,w-2*radius-2,1);
      rect('#0005',x+radius+1,y+h-3,w-2*radius-2,2);
    };
    const sizes={ashlar:[43,21],largeBlock:[64,32],brick:[32,14],cobble:[26,20],marble:[64,64],
      plaster:[64,64],thinSlate:[41,8],herring:[32,16]};
    const [w,h]=sizes[design.pattern];
    for(let row=0;row*h<size;row++) for(let col=-1;col*w<size;col++){
      const x=col*w+(row%2)*Math.floor(w/2);
      const y=row*h;
      if(design.pattern==='herring'){
        block(x,y,16,h,1);
        block(x+16,y+(col%2===0?2:0),16,h-2,1);
      } else block(x,y,w,h,design.pattern==='cobble'?7:2);
    }
    if(design.pattern==='plaster'){

    }
    if(design.pattern==='marble'){
      g.strokeStyle='#65587365';
      for(let vein=0;vein<6;vein++){
        g.beginPath();g.moveTo(vein*25-15,0);
        for(let y=8;y<=size;y+=8) g.lineTo(vein*25+y*.35+(random()-.5)*13,y);
        g.stroke();
      }
    }
    for(let i=0;i<860;i++){
      const x=random()*size,y=random()*size;
      rect(i%2?'#fff1':'#0002',x,y,1+random()*3,1+random()*2);
    }
    if(['moss','frost','patina'].includes(design.accent)){
      const tint={moss:'#79905662',frost:'#e5f3ff85',patina:'#54b3ab72'}[design.accent];
      for(let i=0;i<95;i++) rect(tint,random()*size,size-random()**1.7*47,1+random()*5,1+random()*4);

      g.strokeStyle=design.accent==='runes'?'#c29ef184':'#241e20a6';

        g.beginPath();g.moveTo(x,y);g.lineTo(x+4,y+7);g.lineTo(x-2,y+12);g.stroke();
      }
    }
  });
}

const GUARD_RANGE=8;
const GUARD_HALF_ANGLE=.37;
const GUARD_RAYS=32;
const GUARD_DAMAGE={pistol:24,shotgun:55,ar15:25,ak47:30,smg:17};
const NPC_ROSTER=[
  ['scout','Hooded scout','#485345'],
  ['jester','Jester','#842944'],
  ['officer','Patrol officer','#273e59'],
  ['security','Security officer','#558db7'],
  ['detective','Detective','#3e424b'],
  ['investigator','Investigator','#585156']
];
let guards=[], guardFloor, guardWaypoints, guardStrikeGrace=0;

function startGuard(){
  const cols=room[0].length;
  guardFloor=room.map((row,y)=>row.map((cell,x)=>
    (cell==='.'||cell==='A') && !actors.some(a=>a.radius && Math.hypot(a.x-x-.5,a.y-y-.5)<a.radius+.22)));
  const getPoint=key=>{
    const [x,y]=key.split(',').map(Number);
    const offset=[[0,0],[1,0],[-1,0],[0,1],[0,-1]].find(([dx,dy])=>guardFloor[y+dy]?.[x+dx]);
    return offset ? (y+offset[1])*cols+x+offset[0] : null;
  };
  guardWaypoints=[...rooms.keys()].map(getPoint).filter(point=>point!==null);
  guards=[];
  guardStrikeGrace=0;
  const roomsForGuards=guardWaypoints.slice(1);
  const used=new Set();
  for(const [i,[id,name]] of NPC_ROSTER.entries()){
    const preferred=roomsForGuards[Math.round(i*(roomsForGuards.length-1)/(NPC_ROSTER.length-1))] ?? guardWaypoints[0];
    const px=preferred%cols,py=Math.floor(preferred/cols);
    const initial=[[0,0],[2,0],[-2,0],[0,2],[0,-2],[1,0],[-1,0],[0,1],[0,-1]]
      .map(([dx,dy])=>({x:px+dx,y:py+dy}))
      .filter(({x,y})=>guardFloor[y]?.[x])
      .map(({x,y})=>cellKey(x,y))
      .find(point=>!used.has(point)) ?? roomsForGuards.find(point=>!used.has(point)) ??
      guardFloor.flat().findIndex((walkable,point)=>walkable&&!used.has(point));
    if(initial<0) continue;
    used.add(initial);
    const x=initial%cols+.5,y=Math.floor(initial/cols)+.5;
    const guard={kind:'guard',id,name,x,y,height:.85,
      angle:i===0?Math.atan2(player.y-y,player.x-x):i*Math.PI/2,
      wait:1.8+i*.35,path:[],pathIndex:0,waypoint:(guardWaypoints.indexOf(preferred)+1)%guardWaypoints.length,
      walk:0,moving:false,spotted:false,hp:85,mode:'patrol',lastSeen:null,repath:0,search:0,
      attackCooldown:0,hitFlash:0,beam:new Float32Array(GUARD_RAYS+1)};
    guards.push(guard);
    actors.push(guard);
    refreshGuardBeam(guard);
  }
  updateGuardStatus();
}

function guardPath(guard,target){
  const cols=room[0].length;
  const start=cellKey(Math.floor(guard.x),Math.floor(guard.y));
  if(!guardFloor[Math.floor(target/cols)]?.[target%cols]) return [];
  const previous=new Int32Array(cols*room.length).fill(-1);
  previous[start]=start;
  const queue=[start];
  for(let i=0;i<queue.length && previous[target]<0;i++){
    const point=queue[i],x=point%cols,y=Math.floor(point/cols);
    for(const [dx,dy] of DIRS){
      const nx=x+dx,ny=y+dy;
      if(!guardFloor[ny]?.[nx]) continue;
      const id=cellKey(nx,ny);
      if(previous[id]>=0) continue;
      previous[id]=point;
      queue.push(id);
    }
  }
  if(previous[target]<0) return [];
  const path=[];
  for(let point=target;point!==start;point=previous[point]) path.push(point);
  return path.reverse();
}

function setGuardPath(guard,target){
  guard.path=guardPath(guard,target);
  guard.pathIndex=0;
}

function advanceGuard(guard,x,y,dt,speed){
  const dx=x-guard.x,dy=y-guard.y,d=Math.hypot(dx,dy);
  const step=Math.min(d,dt*speed);
  if(step>.00001){
    guard.angle=Math.atan2(dy,dx);
    guard.x+=dx*step/d;guard.y+=dy*step/d;
    guard.walk+=step;
    guard.moving=true;
  }
  return d<=step+.001;
}

function followGuardPath(guard,dt,speed){
  const cols=room[0].length,point=guard.path[guard.pathIndex];
  if(point===undefined) return false;
  if(advanceGuard(guard,point%cols+.5,Math.floor(point/cols)+.5,dt,speed)) guard.pathIndex++;
  return true;
}

function updateGuards(dt){
  if(escaped||defeated) return;
  guardStrikeGrace=Math.max(0,guardStrikeGrace-dt);
  for(const guard of guards){
    updateGuard(guard,dt);
    if(defeated) break;
  }
  updateGuardStatus();
}
function updateGuard(guard,dt){
  guard.moving=false;
  guard.hitFlash=Math.max(0,guard.hitFlash-dt);
  if(guard.done) return;
  guard.attackCooldown=Math.max(0,guard.attackCooldown-dt);
  guard.repath=Math.max(0,guard.repath-dt);
  const sees=guardSeesPlayer(guard);
  if(sees){
    if(guard.mode!=='pursuit') guard.repath=0;
    guard.mode='pursuit';
    guard.lastSeen={x:player.x,y:player.y};
  } else if(guard.mode==='pursuit'){
    guard.mode='search';
    guard.search=4;
    guard.repath=0;
  }
  if(guard.mode==='patrol'){
    if(guard.wait>0) guard.wait=Math.max(0,guard.wait-dt);
    else if(!followGuardPath(guard,dt,1.45)){
      setGuardPath(guard,guardWaypoints[guard.waypoint]);
      guard.waypoint=(guard.waypoint+1)%guardWaypoints.length;
      guard.wait=.65;
    }
  } else {
    const target=guard.lastSeen;
    const distance=Math.hypot(target.x-guard.x,target.y-guard.y);
    if(sees && distance<1.02){
      guard.angle=Math.atan2(target.y-guard.y,target.x-guard.x);
      if(guard.attackCooldown===0 && guardStrikeGrace===0){
        guard.attackCooldown=1.15;
        guardStrikeGrace=.55;
        turn++;
        tell(`${guard.name} struck you.`);
        hurt(12);
      }
    } else {
      if(guard.repath===0){
        setGuardPath(guard,cellKey(Math.floor(target.x),Math.floor(target.y)));
        guard.repath=.35;
      }
      if(!followGuardPath(guard,dt,2.25) && sees && distance<1.8) advanceGuard(guard,target.x,target.y,dt,2.25);
    }
    if(guard.mode==='search'){
      guard.search-=dt;
      if(distance<1.2) guard.angle+=dt*1.65;
      if(guard.search<=0){
        guard.mode='patrol';
        guard.path=[];guard.pathIndex=0;guard.wait=.55;
      }
    }
  }
  refreshGuardBeam(guard);
  guard.spotted=!defeated&&guardSeesPlayer(guard);
}

function hitGuard(dx,dy,limit,damage){
  let guard,hit;
  for(const candidate of guards){
    if(candidate.done) continue;
    const contact=tracePillar(dx,dy,[{x:candidate.x,y:candidate.y,radius:.36}],hit?.distance??limit);
    if(contact){guard=candidate;hit=contact;}
  }
  if(!hit) return null;
  guard.hp=Math.max(0,guard.hp-damage);
  guard.hitFlash=.16;
  turn++;
  if(!guard.hp){
    guard.done=true;
    guard.spotted=false;
    updateGuardStatus();
    tell(`${guard.name} defeated.`);
  } else {
    guard.mode='search';
    guard.lastSeen={x:player.x,y:player.y};
    guard.angle=Math.atan2(player.y-guard.y,player.x-guard.x);
    guard.search=4;
    guard.repath=0;
    refreshGuardBeam(guard);
  }
  return hit;
}

function guardRayLimit(guard,dx,dy){
  const wall=cast(dx,dy,null,guard).distance;
  const limit=Math.min(GUARD_RANGE,wall);
  return tracePillar(dx,dy,pillars,limit,guard)?.distance ?? limit;
}
function refreshGuardBeam(guard){
  guard.fx=Math.cos(guard.angle);
  guard.fy=Math.sin(guard.angle);
  for(let i=0;i<=GUARD_RAYS;i++){
    const angle=guard.angle+GUARD_HALF_ANGLE*(2*i/GUARD_RAYS-1);
    guard.beam[i]=guardRayLimit(guard,Math.cos(angle),Math.sin(angle));
  }
}
function guardSeesPlayer(guard){
  const dx=player.x-guard.x,dy=player.y-guard.y,d=Math.hypot(dx,dy);
  if(d<.001) return true;
  if(d>GUARD_RANGE || guard.fx*dx+guard.fy*dy<d*Math.cos(GUARD_HALF_ANGLE)) return false;
  return d<guardRayLimit(guard,dx/d,dy/d);
}
function updateGuardStatus(){
  const badge=byId('guard-status');
  const remaining=guards.filter(g=>!g.done);
  const spotted=!defeated&&remaining.some(g=>g.spotted);
  const label=!remaining.length?'NPCs: Defeated':spotted?'NPCs: Spotted':
    remaining.some(g=>g.mode==='search')?'NPCs: Searching':'NPCs: Hidden';
  if(badge.textContent===label) return;
  badge.textContent=label;
  badge.classList.toggle('spotted',spotted);
}
function guardBeamAt(x,y){
  let beam=0;
  for(const guard of guards) if(!guard.done) beam=Math.max(beam,guardConeAt(guard,x,y));
  return beam;
}
function guardConeAt(guard,x,y){
  const dx=x-guard.x,dy=y-guard.y,d2=dx*dx+dy*dy;
  if(d2>GUARD_RANGE*GUARD_RANGE) return 0;
  const local=Math.atan2(guard.fx*dy-guard.fy*dx,
    guard.fx*dx+guard.fy*dy);
  const center=local/GUARD_HALF_ANGLE;
  if(Math.abs(center)>=1) return 0;
  const i=Math.min(GUARD_RAYS-1,Math.floor((center+1)*GUARD_RAYS/2));
  const d=Math.sqrt(d2);
  if(d>Math.min(guard.beam[i],guard.beam[i+1])+.055) return 0;
  return (1-Math.abs(center)**5)*Math.max(.18,1-d/GUARD_RANGE);
}

function loadGuardAtlas(id,source,w,h){
  if(typeof Image==='undefined') return;
  const atlas=new Image(),frames=[];
  atlas.onload=()=>{
    for(let row=0;row<3;row++) for(let col=0;col<4;col++){
      frames.push(surface(w,h,(_,g)=>g.drawImage(atlas,col*w,row*h,w,h,0,0,w,h)));
    }
    for(let col=0;col<4;col++) frames.push(surface(w,h,(_,g)=>{
      g.translate(w,0);g.scale(-1,1);g.drawImage(frames[4+col],0,0);
    }));
    npcFrames[id]=frames;
  };
  atlas.src=source;
}

function guardSprite(a){
  const dx=player.x-a.x,dy=player.y-a.y;
  const facing=Math.atan2(dy,dx)-a.angle;
  const front=Math.cos(facing);
  const row=front>.64?0:front<-.64?2:Math.sin(facing)>0?1:3;
  const col=a.moving ? [1,2,3,2][Math.floor(a.walk*4.8)%4] : 0;
  return npcFrames[a.id]?.[row*4+col] ?? npcFallbacks[a.id];
}

function spriteFor(actor) {
  if(actor.kind==='guard') return guardSprite(actor);
  if(actor.kind==='weapon') return weaponIcons[actor.id];
  if(actor.kind==='furnishing') return roomProps[actor.art];
  return actor.kind==='crate' ? sprites[actor.done?'opened':'crate'] : sprites[actor.kind];
}
function visibleActor(actor) {
  return !actor.done || actor.kind==='crate';
}
// Pilot materials use larger patterns and a world-aligned light map.
const FIELD_SAMPLES=2;
const FIELD_LIGHT_SIZE=ROOM_SIZE*FIELD_SAMPLES+1;
function softSlabs(floorColor,design){
  return surface(256,256,rect=>{
  rect(floorColor,0,0,256,256);
  for(let row=0;row<2;row++){
    const y=row*128;
    const shift=design.id%4*7;
    for(const x of (row===0?[0,84+shift,177-shift]:[0,117-shift,203+shift])){
      rect('#292c323b',x,y,3,128);
      rect('#b9b9bf22',x+3,y,2,128);
    }
    rect('#25293245',0,y,256,3);
    rect('#b8bbc022',0,y+3,256,2);
  }
  for(let i=0;i<1800;i++) rect(i%2?'#1219230a':'#c5cbd20b',(i*137)%256,(i*97+Math.floor(i/13)*19)%256,1+i%4,1+i%3);
  }).getContext('2d').getImageData(0,0,256,256).data;
}
function softMasonry(design,variant){
  return surface(512,128,(rect,g)=>{
  rect(design.mortar,0,0,512,128);
  const rows=[[87,134,110,181],[52,143,119,130,68],[128,101,172,111],[61,147,157,147]];
  rows.forEach((_,row)=>{
    const blocks=rows[(row+variant)%rows.length];
    let left=0;
    const color=tone=>`rgb(${design.base.map(v=>Math.max(0,Math.min(255,v+tone))).join(',')})`;
    const layout=design.pattern==='brick'||design.pattern==='thinSlate' ?
      blocks.flatMap(w=>[Math.floor(w*.47),w-Math.floor(w*.47)]) : blocks;
    for(const [i,w] of layout.entries()){
      const y=row*32;
      rect(color(((i*19+row*23+design.id*11+variant*13)%25)-12),left+1,y+1,w-2,30);
      rect('#cbc7bb23',left+2,y+2,w-4,2);
      rect('#15161629',left+2,y+28,w-4,2);
      if((i+row+design.id)%7===0){
        const x=left+w*.62;
        g.strokeStyle='#211e1e55';
        g.beginPath();g.moveTo(x,y+2);g.lineTo(x-5,y+13);g.lineTo(x+2,y+20);g.lineTo(x-2,y+27);g.stroke();
      }
      left+=w;
    }
  });
  for(let i=0;i<1800;i++) rect(i%2?'#181c140c':'#aab48f10',(i*139)%512,(i*71+Math.floor(i/33)*13)%128,2+i%5,2);
  const band={bands:'#31363d',timber:'#644734',goldLine:'#b39656'}[design.accent];
  if(band){
    for(const y of [31,96]) rect(band,0,y,512,design.accent==='goldLine'?2:6);
  }
  });
}
const smoothWalls=WALL_DESIGNS.map(design=>[0,1,2].map(variant=>softMasonry(design,variant)));
for(const theme of Object.values(themes)){
  theme.smoothWalls=smoothWalls[theme.design.id-1];
  theme.smoothFloor=softSlabs(theme.floorColor,theme.design);
}
function usesSmoothFinish(theme){ return theme.id!=='acid'||smoothAcid; }
function bakeRoomLight(left,top){
  left+=1; top+=1;
  const nearby=ceilingLights.filter(t=>t.x>=left-.5 && t.x<=left+ROOM_SIZE+.5 && t.y>=top-.5 && t.y<=top+ROOM_SIZE+.5);
  const columns=pillars.filter(p=>p.x>=left && p.x<=left+ROOM_SIZE && p.y>=top && p.y<=top+ROOM_SIZE);
  const values=new Float32Array(FIELD_LIGHT_SIZE**2);
  const cool=new Float32Array(values.length);
  for(let y=0;y<FIELD_LIGHT_SIZE;y++) for(let x=0;x<FIELD_LIGHT_SIZE;x++){
    const wx=left+x/FIELD_SAMPLES,wy=top+y/FIELD_SAMPLES;
    const px=Math.floor(wx),py=Math.floor(wy);
    const edgeX=wx-px,edgeY=wy-py;
    const corner=Math.max(
      solid(px-1,py)?1-edgeX:0,solid(px+1,py)?edgeX:0,
      solid(px,py-1)?1-edgeY:0,solid(px,py+1)?edgeY:0);
    let shadow=corner**2*.17,tint=0;
    for(const pillar of columns) shadow=Math.max(shadow,.34*Math.exp(-((wx-pillar.x)**2+(wy-pillar.y)**2)/1.2));
    for(const lamp of nearby) tint+=.66*Math.exp(-((wx-lamp.x)**2+(wy-lamp.y)**2)/6);
    const i=y*FIELD_LIGHT_SIZE+x;

function sampleRoomLight(field,x,y,result){
  const px=Math.max(0,Math.min(FIELD_LIGHT_SIZE-1.001,(x-field.left)*FIELD_SAMPLES));
  const py=Math.max(0,Math.min(FIELD_LIGHT_SIZE-1.001,(y-field.top)*FIELD_SAMPLES));

  const i=iy*FIELD_LIGHT_SIZE+ix;

  const j=i+FIELD_LIGHT_SIZE, light=field.values, cool=field.cool;
  result[0]=light[i]*w0+light[i+1]*w1+light[j]*w2+light[j+1]*w3;
  result[1]=cool[i]*w0+cool[i+1]*w1+cool[j]*w2+cool[j+1]*w3;

function renderPlanes(fx,fy,rx,ry,flicker) {
  const data = planes.data;
  const lighting=[0,0];
  for (let y=0; y<height; y++) {
    const isFloor = y >= horizon;
    const planeOffset=isFloor ? EYE_HEIGHT : CEILING_HEIGHT-EYE_HEIGHT;
    const distance=planeOffset*focal/Math.abs(y+0.5-horizon);
    const step = distance/focal;
    let worldX = player.x+distance*fx+(0.5-width/2)*step*rx;
    let worldY = player.y+distance*fy+(0.5-width/2)*step*ry;
    const light = Math.max(.17, 1/(1+distance*.27))*(isFloor?1:.65);
    for (let x=0; x<width; x++) {
      const theme=themeAt(worldX,worldY);
      const field=roomLights[Math.floor(worldY/ROOM_SPACING)]?.[Math.floor(worldX/ROOM_SPACING)];
      const index=(y*width+x)*4;
      lighting[0]=.54; lighting[1]=0;
      if(field) sampleRoomLight(field,worldX,worldY,lighting);
      const smooth=usesSmoothFinish(theme), mask=smooth?255:63, scale=smooth?96:64;
      const texture=smooth?theme.smoothFloor:theme.floor;
      const sample=((Math.floor(worldY*scale)&mask)*(mask+1)+(Math.floor(worldX*scale)&mask))*4;
      const glow=lighting[1]*flicker;
      const brightness=light*(lighting[0]+glow*.6);
      data[index]=texture[sample]*brightness+glow*6;
      data[index+1]=texture[sample+1]*brightness+glow*13;
      data[index+2]=texture[sample+2]*brightness+glow*22;
      if(!isFloor && field && glow>.3){
        for(const lamp of field.fixtures){
          const dx=Math.abs(worldX-lamp.x),dy=Math.abs(worldY-lamp.y);
          if(dx>=lamp.halfWidth || dy>=lamp.halfLength) continue;
          const rim=dx>lamp.halfWidth-.045 || dy>lamp.halfLength-.055;
          data[index]=rim?67:212*flicker;
          data[index+1]=rim?76:235*flicker;
          data[index+2]=rim?88:250*flicker;
          break;
        }
      }
      if(isFloor){
        const beam=guardBeamAt(worldX,worldY);
        data[index]+=beam*65;
        data[index+1]+=beam*60;
        data[index+2]+=beam*43;
      }
      data[index+3] = 255;
      worldX += step*rx;
      worldY += step*ry;
    }
  }
  ctx.putImageData(planes,0,0);
}
// Intersect the horizontal ray with the round shaft before the distant wall.
function tracePillar(dx,dy,candidates,limit,origin=player){
  const rayLength=dx*dx+dy*dy;
  let hit;
  for(const p of candidates){
    const x=p.x-origin.x,y=p.y-origin.y;
    const radius=p.radius*.84, forward=x*dx+y*dy;
    const discriminant=forward*forward-rayLength*(x*x+y*y-radius*radius);
    if(forward<=0 || discriminant<0) continue;
    const distance=(forward-Math.sqrt(discriminant))/rayLength;
    if(distance<=0 || distance>=limit) continue;
    limit=distance;
    const normalX=(distance*dx-x)/radius,normalY=(distance*dy-y)/radius;
    hit={distance,normalX,normalY};
  }
  return hit;
}
function paintPillar(column,top,height,{normalX,normalY}){
  const light=Math.round(53+Math.max(0,(normalX-normalY)*.65)*67);
  const band=Math.floor((Math.atan2(normalY,normalX)+Math.PI)*7)%2;
  ctx.fillStyle=`rgb(${light+band*5},${light+band*7},${light-8})`;
  ctx.fillRect(column,top,1,height);
  for(const [start,thickness] of [[.03,.09],[.77,.035],[.87,.055],[.95,.05]]){
    ctx.fillStyle='#93917e';
    ctx.fillRect(column,top+height*start,1,height*thickness);
    ctx.fillStyle='#454438';
    ctx.fillRect(column,top+height*(start+thickness*.66),1,height*thickness*.34);
  }
  if(band) {
    ctx.fillStyle='#76884d99';
    ctx.fillRect(column,top+height*(.7+normalY*.07),1,height*.12);
  }
}

function renderFirstPerson(flicker) {
  const fx=Math.cos(player.angle), fy=Math.sin(player.angle), rx=-fy, ry=fx;
  renderPlanes(fx,fy,rx,ry,flicker);
  const nearbyPillars=pillars.filter(p=>Math.abs(p.x-player.x)<24 && Math.abs(p.y-player.y)<24);
  const openings=Array.from({length:width},()=>[]);
  for (let x=0; x<width; x++) {
    const camera = (x+0.5-width/2)/focal;
    const dx=fx+rx*camera,dy=fy+ry*camera;
    const hit=cast(dx,dy,openings[x]);
    const column=tracePillar(dx,dy,nearbyPillars,hit.distance);
    const d=Math.max(.01,column?.distance ?? hit.distance), scale=focal/d;
    const h=CEILING_HEIGHT*scale, top=horizon-(CEILING_HEIGHT-EYE_HEIGHT)*scale;
    depth[x] = d;
    const face=themeAt(player.x+dx*Math.max(0,d-.02),player.y+dy*Math.max(0,d-.02));
    const smooth=usesSmoothFinish(face);
    if(column) paintPillar(x,top,h,column);
    else {
      const lateralOffset=hit.side==='x'?hit.x:hit.y;
      const variant=(lateralOffset+(hit.side==='x'?1:0)+3)%3;
      const texture=smooth ? face.smoothWalls[variant] : face.wall;
      const worldU=hit.side==='x' ? player.y+dy*d : player.x+dx*d;
      const source=smooth ? (Math.floor(worldU*108+lateralOffset*51)&511) : Math.floor(hit.u*texture.width);
      ctx.drawImage(texture,source,0,1,texture.height,x,top,1,h);
    }
    const hitX=player.x+(fx+rx*camera)*d, hitY=player.y+(fy+ry*camera)*d;
    const ceilingGlow=ceilingLightAt(hitX-dx*.02,hitY-dy*.02)*flicker;
    const light=(hit.side==='x'?.75:.62)/(1+d*.16);
    ctx.fillStyle=`rgba(10,13,19,${Math.max(0,1-light-ceilingGlow*.33)})`;
    ctx.fillRect(x,top,1,h);
    if(smooth){
      const stain=(Math.sin(hitX*.49)*Math.cos(hitY*.47)+1)*.075;
      const color=face.id==='acid'||face.design.accent==='moss'?'34,52,27':'27,24,27';
      ctx.fillStyle=`rgba(${color},${stain})`;
      ctx.fillRect(x,top,1,h);
    }
    if(ceilingGlow>0){
      ctx.fillStyle=`rgba(171,213,247,${ceilingGlow*.19})`;
      ctx.fillRect(x,top,1,h);
    }
    const beam=guardBeamAt(hitX-dx*.035,hitY-dy*.035);
    if(beam>0){
      ctx.fillStyle=`rgba(238,228,185,${beam*.35})`;
      ctx.fillRect(x,top+(h*.28),1,h*.72);
    }
    openings[x]=openings[x].filter(opening=>opening.distance<d);
    for(const opening of openings[x].reverse()){
      const entry=Math.max(0,opening.distance-.02);
      const theme=themeAt(player.x+dx*entry,player.y+dy*entry);
      const glow=ceilingLightAt(player.x+dx*entry,player.y+dy*entry)*flicker;
      opening.band=paintArch(x,opening.distance,opening.lateral,theme,glow);
    }
  }

  const visible = actors.filter(a=>a.kind!=='pillar' && visibleActor(a)).map(a => {
    const dx=a.x-player.x, dy=a.y-player.y;
    return { a, d:dx*fx+dy*fy, lateral:dx*rx+dy*ry };
  }).filter(s => s.d > .08).sort((a,b) => b.d-a.d);
  for (const {a,d,lateral} of visible) {
    const sprite = spriteFor(a);
    const scale = focal/d, h = a.height*scale, w = h*sprite.width/sprite.height;
    const start = width/2+lateral*scale-w/2;
    const lift=(a.lift ?? 0)+(a.kind==='spores'?.037*Math.sin(flicker*13+a.x):0);
    const top = horizon+(EYE_HEIGHT-lift)*scale-h;
    ctx.globalAlpha = Math.max(.6,1-d*.032)*(a.kind==='guard'&&a.hitFlash>0?.67:1);
    for (let x=Math.max(0,Math.ceil(start)); x<Math.min(width,start+w); x++) {
      if(depth[x]<=d) continue;
      const sourceX=Math.floor((x-start)/w*sprite.width);
      let parts=[[top,top+h]];
      for(const {distance,band} of openings[x]){
        if(distance>=d) continue;
        parts=parts.flatMap(([lo,hi])=>hi<=band[0]||lo>=band[1] ? [[lo,hi]] :
          [[lo,Math.min(hi,band[0])],[Math.max(lo,band[1]),hi]].filter(([a,b])=>b>a));
      }
      for(const [lo,hi] of parts){
        ctx.drawImage(sprite,sourceX,(lo-top)/h*sprite.height,1,(hi-lo)/h*sprite.height,x,lo,1,hi-lo);
      }
    }
    ctx.globalAlpha = 1;
  }
  drawPunchImpact(fx,fy,rx,ry);
  const field=roomLights[Math.floor(player.y/ROOM_SPACING)]?.[Math.floor(player.x/ROOM_SPACING)];
  const sector=[.73,0];
  if(field) sampleRoomLight(field,player.x,player.y,sector);
  const light=Math.min(1.24,sector[0]*.84+sector[1]*flicker*.45),warmth=0;
  const item=activeWeapon();
  if(item) drawWeaponModel(item,light,warmth);
  else viewmodel.render(ctx,width,height,light,warmth);
  drawCrosshair();
}
const archLighting=[0,0];
function ceilingLightAt(x,y){
  const field=roomLights[Math.floor(y/ROOM_SPACING)]?.[Math.floor(x/ROOM_SPACING)];
  if(!field) return 0;
  sampleRoomLight(field,x,y,archLighting);
  return archLighting[1];
}
function paintArch(column,distance,lateral,theme,glow=0){
  const scale=focal/Math.max(.01,distance);
  const u=Math.min(1,Math.abs(lateral)/(ARCH_WIDTH/2));
  const {arch,base,accent}=theme.design;
  const crown=.76+.42*(arch==='pointed' ? 1-u : Math.sqrt(1-u*u));
  const top=horizon-(CEILING_HEIGHT-EYE_HEIGHT)*scale;
  const lip=horizon-(crown-EYE_HEIGHT)*scale;
  const trim=Math.min(lip-top,(arch==='timber'?.09:.075)*scale);
  const smooth=usesSmoothFinish(theme);
  const texture=smooth?theme.smoothWalls[0]:theme.wall;
  const sample=Math.max(0,Math.min(texture.width-1,Math.floor((lateral/ARCH_WIDTH+.5)*texture.width)));
  const cut=(lip-top)/(CEILING_HEIGHT*scale)*texture.height;
  if(cut>0) ctx.drawImage(texture,sample,0,1,cut,column,top,1,lip-top);
  const joint=Math.floor((lateral/ARCH_WIDTH+.5)*(smooth?9:15))%2;
  const tone=joint ? 15 : smooth ? 22 : 35;
  const metal=arch==='ironArch', timber=arch==='timber';
  ctx.fillStyle=metal ? (joint?'#58616d':'#838791') : timber ? (joint?'#644939':'#976b48') :
    `rgb(${base.map(value=>Math.min(255,value+tone)).join(',')})`;
  ctx.fillRect(column,lip-trim,1,trim);
  if(arch==='fluted'||accent==='goldLine'||accent==='runes'){
    ctx.fillStyle=accent==='runes'?'#b388db':accent==='goldLine'?'#e1c783':'#eee6d8';
    ctx.fillRect(column,lip-trim*.38,1,trim*.24);
  }
  if(glow>0){
    ctx.fillStyle=`rgba(171,213,247,${glow*.22})`;
    ctx.fillRect(column,top,1,lip-top);
  }
  return [top,lip];
}

function loadArmPose(pose){
  if(typeof Image==='undefined') return pose;
  const image=new Image();
  image.onload=()=>{
    const silhouette=color=>surface(image.width,image.height,(rect,g)=>{
      g.drawImage(image,0,0);
      g.globalCompositeOperation='source-in';
      rect(color,0,0,image.width,image.height);
    });
    pose.image=image;
    pose.shadow=silhouette('#090a12');
    pose.warm=silhouette('#efa353');
  };
  image.src=pose.src;
  return pose;
}
const armPoses=HAND_POSES.map(loadArmPose);
function paintArmSprite(ctx,x,y,reach,scale,light,warmth,ghost=false){
  const extended=reach>.12;
  const pose=armPoses[extended?1:0];
  const extension=Math.max(0,reach);
  return drawBareArm(ctx,pose,x,y,extended?428-94*extension:x+22,extended?326:309,
    true,light,warmth,ghost?26*scale:0);
}

function drawBareArm(ctx,pose,x,y,shoulderX,shoulderY,rightHand,light,warmth,clipRadius=0){
  if(!pose.image) return false;
  const [tipX,tipY,baseX,baseY]=pose.anchor;
  const dx=shoulderX-x,dy=shoulderY-y;
  const spriteScale=Math.hypot(dx,dy)/Math.hypot(baseX-tipX,baseY-tipY);
  const opacity=ctx.globalAlpha;
  ctx.save();
  if(clipRadius){
    ctx.beginPath();ctx.arc(x,y,clipRadius,0,Math.PI*2);ctx.clip();
  }
  ctx.translate(x,y);
  ctx.rotate(Math.atan2(dy,dx));
  // The original artwork is left-handed. Reflect it for the right hand.
  ctx.scale(spriteScale,rightHand?-spriteScale:spriteScale);
  ctx.rotate(-Math.atan2(baseY-tipY,baseX-tipX));
  ctx.drawImage(pose.image,-tipX,-tipY);
  const shadow=Math.max(0,Math.min(.38,(1-light)*.67));
  if(shadow){
    ctx.globalAlpha=opacity*shadow;
    ctx.drawImage(pose.shadow,-tipX,-tipY);
  }
  if(warmth>.015){
    ctx.globalAlpha=opacity*Math.min(.16,warmth*.19);
    ctx.drawImage(pose.warm,-tipX,-tipY);
  }
  ctx.restore();
  return true;
}

const sleeveGrain=ctx.createPattern(surface(64,64,rect=>{
  for(let i=0;i<1700;i++) rect(i%3?'#0001':'#fff1',(i*17+Math.floor(i/64)*41)%64,(i*31+Math.floor(i/29)*7)%64,1,1);
}),'repeat');

  drawRealisticArm(ctx, sx, sy, fx, fy, scale, light, warmth) {
    const dx = fx - sx;
    const dy = fy - sy;
    const angle = Math.atan2(dy, dx);
    const len = Math.hypot(dx, dy);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    const sleeveEnd = len * 0.62;
    const wristEnd = len * 0.94;

    const shoulderHalfW = 43;
    const elbowHalfW = 29 * Math.sqrt(scale);
    const forearmBulgeW = 21 * scale;
    const wristHalfW = 14 * scale;

    const sleeveGrad = ctx.createLinearGradient(0, -shoulderHalfW, 0, shoulderHalfW);
    sleeveGrad.addColorStop(0, this.litColor(66, 88, 62, light, warmth));
    sleeveGrad.addColorStop(0.45, this.litColor(42, 58, 40, light, warmth));
    sleeveGrad.addColorStop(1, this.litColor(20, 29, 20, light, warmth));

    ctx.fillStyle = sleeveGrad;
    ctx.beginPath();
    ctx.moveTo(0, -shoulderHalfW);
    ctx.bezierCurveTo(sleeveEnd * 0.45, -shoulderHalfW * 0.92, sleeveEnd * 0.75, -elbowHalfW * 1.05, sleeveEnd, -elbowHalfW);
    ctx.lineTo(sleeveEnd, elbowHalfW);
    ctx.bezierCurveTo(sleeveEnd * 0.75, elbowHalfW * 1.05, sleeveEnd * 0.45, shoulderHalfW * 0.92, 0, shoulderHalfW);
    ctx.closePath();
    ctx.fill();

    if (sleeveGrain) {
      ctx.fillStyle = sleeveGrain;
      ctx.fill();
    }
    ctx.strokeStyle = this.litColor(16, 22, 16, light, 0);
    ctx.lineWidth = 2.2;
    ctx.stroke();

    ctx.strokeStyle = this.litColor(18, 26, 18, light, 0);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sleeveEnd * 0.78, -elbowHalfW * 0.75);
    ctx.quadraticCurveTo(sleeveEnd * 0.88, 0, sleeveEnd * 0.78, elbowHalfW * 0.75);
    ctx.stroke();

    const skinGrad = ctx.createLinearGradient(0, -forearmBulgeW, 0, forearmBulgeW);
    skinGrad.addColorStop(0, this.litColor(196, 152, 122, light, warmth));     // Top/lit edge
    skinGrad.addColorStop(0.55, this.litColor(152, 114, 88, light, warmth * 0.6));
    skinGrad.addColorStop(1, this.litColor(96, 69, 52, light, 0));               // Shaded underside

    ctx.fillStyle = skinGrad;
    ctx.beginPath();
    ctx.moveTo(sleeveEnd - 2, -elbowHalfW * 0.92);
    ctx.bezierCurveTo(
      sleeveEnd + (wristEnd - sleeveEnd) * 0.35, -forearmBulgeW * 1.08,
      sleeveEnd + (wristEnd - sleeveEnd) * 0.75, -wristHalfW * 1.15,
      wristEnd, -wristHalfW
    );
    ctx.lineTo(wristEnd, wristHalfW);
    ctx.bezierCurveTo(
      sleeveEnd + (wristEnd - sleeveEnd) * 0.75, wristHalfW * 1.15,
      sleeveEnd + (wristEnd - sleeveEnd) * 0.35, forearmBulgeW * 1.08,
      sleeveEnd - 2, elbowHalfW * 0.92
    );
    ctx.closePath();
    ctx.fill();

    if (sleeveGrain) {
      ctx.fillStyle = sleeveGrain;
      ctx.fill();
    }

    ctx.strokeStyle = this.litColor(115, 84, 65, light, 0);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sleeveEnd + 8, -forearmBulgeW * 0.2);
    ctx.quadraticCurveTo(sleeveEnd + (wristEnd - sleeveEnd) * 0.55, -wristHalfW * 0.35, wristEnd - 4, -wristHalfW * 0.25);
    ctx.stroke();

    ctx.restore();
  }

  drawRealisticFist(ctx, light, warmth, isGhost) {
    const grad = ctx.createRadialGradient(-8, -14, 4, 0, 2, 54);
    grad.addColorStop(0, this.litColor(208, 162, 130, light, warmth));
    grad.addColorStop(0.55, this.litColor(154, 115, 89, light, warmth * 0.65));
    grad.addColorStop(1, this.litColor(88, 63, 47, light, 0));

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-34, 28);
    ctx.bezierCurveTo(-40, 10, -40, -22, -30, -32);
    ctx.bezierCurveTo(-15, -40, 18, -40, 32, -30);
    ctx.bezierCurveTo(40, -18, 39, 14, 31, 28);
    ctx.bezierCurveTo(16, 35, -18, 35, -34, 28);
    ctx.closePath();
    ctx.fill();

    if (!isGhost && sleeveGrain) {
      ctx.fillStyle = sleeveGrain;
      ctx.fill();
    }

    if (isGhost) return;

    const fingerSpecs = [
      { x: -31, y: -33, w: 15, h: 25 }, // Index
      { x: -15, y: -35, w: 16, h: 28 }, // Middle
      { x: 2,   y: -34, w: 15, h: 27 }, // Ring
      { x: 18,  y: -31, w: 13, h: 23 }  // Pinky
    ];

    for (const f of fingerSpecs) {
      const fGrad = ctx.createLinearGradient(f.x, f.y, f.x, f.y + f.h);
      fGrad.addColorStop(0, this.litColor(214, 168, 136, light, warmth));
      fGrad.addColorStop(0.45, this.litColor(156, 117, 90, light, warmth * 0.6));
      fGrad.addColorStop(1, this.litColor(92, 66, 49, light, 0));

      ctx.fillStyle = fGrad;
      ctx.beginPath();
      ctx.roundRect(f.x, f.y, f.w, f.h, [7, 7, 5, 5]);
      ctx.fill();

      ctx.strokeStyle = this.litColor(74, 52, 38, light, 0);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(f.x + f.w, f.y + 3);
      ctx.lineTo(f.x + f.w, f.y + f.h - 2);
      ctx.stroke();

      ctx.fillStyle = `rgba(255, 232, 210, ${0.14 * Math.min(1.2, light)})`;
      ctx.beginPath();
      ctx.ellipse(f.x + f.w * 0.5, f.y + 6, f.w * 0.32, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = this.litColor(82, 58, 43, light, 0);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(f.x + 2, f.y + f.h * 0.55);
      ctx.lineTo(f.x + f.w - 2, f.y + f.h * 0.55);
      ctx.stroke();
    }

    const thumbGrad = ctx.createLinearGradient(-34, -8, 18, 12);
    thumbGrad.addColorStop(0, this.litColor(198, 153, 122, light, warmth));
    thumbGrad.addColorStop(0.7, this.litColor(146, 108, 83, light, warmth * 0.5));
    thumbGrad.addColorStop(1, this.litColor(94, 68, 51, light, 0));

    ctx.fillStyle = thumbGrad;
    ctx.beginPath();
    ctx.moveTo(-36, 12);
    ctx.bezierCurveTo(-36, -6, -12, -12, 16, -6);
    ctx.bezierCurveTo(22, -4, 22, 6, 15, 9);
    ctx.bezierCurveTo(-6, 14, -22, 18, -36, 12);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = this.litColor(76, 54, 40, light, 0);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-32, -3);
    ctx.bezierCurveTo(-12, -10, 8, -9, 18, -5);
    ctx.stroke();
  }

  litColor(r, g, b, light, warmth) {
    const l = Math.max(0.18, Math.min(1.35, light));
    const w = Math.max(0, Math.min(1, warmth));

    const rr = Math.min(255, Math.round(r * l + w * 28));
    const gg = Math.min(255, Math.round(g * l + w * 12));
    const bb = Math.min(255, Math.round(b * l - w * 8));

    return `rgb(${rr}, ${Math.max(0, gg)}, ${Math.max(0, bb)})`;
  }
}

function weaponShape(points,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for(const p of points.slice(1)) ctx.lineTo(...p);
  ctx.closePath();ctx.fill();
}
function drawWeaponModel(item,light,warmth){
  const spec=WEAPONS[item.id];
  const shotAge=shotTime>0?spec.interval-shotTime:Infinity;
  const kick=spec.kick*Math.max(0,1-shotAge/.17)**2;
  const reload=reloadTime>0?Math.sin(Math.PI*(1-reloadTime/RELOAD_SECONDS)):0;
  const sway=Math.sin(viewmodel.bobPhase*.5)*viewmodel.walkSway*4;
  const bob=Math.cos(viewmodel.bobPhase)*viewmodel.walkSway*2;
  ctx.save();
  ctx.scale(width/480,height/300);
  ctx.translate(353+sway+kick*.45,244+bob-kick*.62+reload*24);
  ctx.rotate(-kick*.005+reload*.19);
  const end=-spec.length, top=-48;
  if(item.id==='pistol'&&pistolPreview?.complete&&pistolPreview.naturalWidth){
    ctx.drawImage(pistolPreview,-56,-84,135,146);
  } else {
    const rail=ctx.createLinearGradient(0,top,0,14);
    rail.addColorStop(0,viewmodel.litColor(136,139,140,light,warmth));
    rail.addColorStop(.24,spec.color);
    rail.addColorStop(1,'#1a1d20');
    weaponShape([[end,top],[end+24,top-4],[17,-19],[40,5],[26,19],[-2,12],[end-2,top+11]],rail);
    weaponShape([[end+4,top-1],[end+10,top-1],[end+10,top-8],[end+5,top-8]],'#33383a');
    weaponShape([[1,-22],[11,-24],[17,-15],[7,-13]],'#858989');
    if(item.id!=='pistol'){
      const finish=['shotgun','ak47'].includes(item.id)?'#785943':'#454d51';
      weaponShape([[end+14,top+5],[end+39,top+7],[-38,-18],[-52,-9],[end+12,top+17]],finish);
      if(item.id==='ak47'){
        weaponShape([[-20,-2],[-7,1],[-10,17],[-23,32],[-35,28],[-24,14]],'#292925');
      } else if(item.id==='ar15'){
        weaponShape([[-17,-2],[-3,2],[-11,29],[-23,27]],'#2d3336');
        for(let x=-78;x<-40;x+=8) weaponShape([[x,-37],[x+3,-37],[x+4,-31],[x+1,-31]],'#252a2e');
      } else if(item.id==='smg'){
        weaponShape([[-15,-2],[-7,0],[-12,24],[-20,23]],'#262b2e');
      } else {
        weaponShape([[end+3,top+9],[end+21,top+10],[end+21,top+15],[end+3,top+14]],'#343137');
      }
    }
    drawBareArm(ctx,armPoses[1],16,24,107,85,true,light,warmth);
  }
  const longGun=item.id!=='pistol';
  if(longGun || reloadTime>0){
    // The same left hand moves from the forward grip to the reload pose.
    const supportX=longGun ? -44+26*reload : -38+20*reload;
    const supportY=longGun ? -14+40*reload : 73-47*reload;
    const shoulderY=longGun ? 79 : 86;
    drawBareArm(ctx,armPoses[1],supportX,supportY,-112,shoulderY,false,light,warmth);
  }
  if(shotAge<.055){
    const x=item.id==='pistol'?-40:end, y=item.id==='pistol'?-62:top;
    const glow=ctx.createRadialGradient(x,y,0,x,y,spec.flash*2);
    glow.addColorStop(0,'#fff3cfbb');glow.addColorStop(1,'#ffad4600');
    ctx.fillStyle=glow;
    ctx.fillRect(x-spec.flash*2,y-spec.flash*2,spec.flash*4,spec.flash*4);
    weaponShape([[x-spec.flash,y],[x-2,y-2],[x,y-spec.flash],[x+2,y-2],[x+spec.flash,y],
      [x+2,y+2],[x,y+spec.flash],[x-2,y+2]],'#ffcf80');
  }
  ctx.restore();
}

function castMeleeRay(){
  const dx=Math.cos(player.angle),dy=Math.sin(player.angle);
  const wall=cast(dx,dy);
  const pillar=tracePillar(dx,dy,pillars,Math.min(1.2,wall.distance));
  const obstacle=pillar?.distance ?? wall.distance;
  const distance=hitGuard(dx,dy,Math.min(1.2,obstacle),20)?.distance ?? obstacle;
  if(distance>1.2) return null;
  return {x:player.x+dx*distance,y:player.y+dy*distance};
}
function drawPunchImpact(fx,fy,rx,ry){
  const impact=shotImpact ?? viewmodel.impact;
  if(!impact) return;
  const dx=impact.x-player.x,dy=impact.y-player.y;
  const d=fx*dx+fy*dy;
  if(d<=.08) return;
  const x=width/2+(rx*dx+ry*dy)*focal/d;
  if(x<0||x>=width||d>depth[Math.floor(x)]+.06) return;
  const p=impact.age/.18,spread=4+18*p;
  ctx.save();
  ctx.globalAlpha=1-p;
  for(let i=0;i<8;i++){
    const angle=i*2.4;
    ctx.fillStyle=i%2?'#e1cb9b':'#ffb866';
    ctx.fillRect(x+Math.cos(angle)*spread,horizon+Math.sin(angle)*spread+p*p*12,2,2);
  }
  ctx.restore();
}

function drawCrosshair(){
  const scale=width/480,x=width/2,y=height/2;
  ctx.beginPath();
  ctx.arc(x,y,5.5*scale,0,Math.PI*2);
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    ctx.moveTo(x+3.2*dx*scale,y+3.2*dy*scale);
    ctx.lineTo(x+9*dx*scale,y+9*dy*scale);
  }
  ctx.strokeStyle='#12130dcc';ctx.lineWidth=2.6*scale;ctx.stroke();
  ctx.strokeStyle='#eee9d7ed';ctx.lineWidth=1.05*scale;ctx.stroke();
  ctx.fillStyle='#eee9d7';
  ctx.fillRect(x-.5*scale,y-.5*scale,scale,scale);
}

function renderMap(mini=false) {
  const size=Math.min(mini ? 7 : 23,(mini ? 158 : height-12)/Math.max(room.length,room[0].length));
  const left=mini ? 9 : (width-room[0].length*size)/2;
  const top=mini ? 9 : (height-room.length*size)/2;
  let layer=mapLayers.get(mini);
  if(!layer){
    const image=surface(width,height,(rect)=>{
      rect('#15120f',mini?left-3:0,mini?top-3:0,mini?room[0].length*size+5:width,mini?room.length*size+5:height);
      room.forEach((row,y)=>row.forEach((cell,x)=>{
        if(cell==='#') return;
        const color=cell==='A'?'#d5bc97':cell==='.'?themeAt(x,y).floorColor:'#8b8378';
        rect(color,left+x*size,top+y*size,Math.ceil(size),Math.ceil(size));
      }));
    });
    layer={image};
    mapLayers.set(mini,layer);
  }
  ctx.drawImage(layer.image,0,0);
  if(!mini) for(const guard of guards){
    if(guard.done) continue;
    ctx.fillStyle='#fce3a04d';
    ctx.beginPath();
    ctx.moveTo(left+guard.x*size,top+guard.y*size);
    for(let i=0;i<=GUARD_RAYS;i++){
      const angle=guard.angle+GUARD_HALF_ANGLE*(2*i/GUARD_RAYS-1);
      ctx.lineTo(left+(guard.x+Math.cos(angle)*guard.beam[i])*size,
        top+(guard.y+Math.sin(angle)*guard.beam[i])*size);
    }
    ctx.closePath();ctx.fill();
  }
  for (const a of actors.filter(visibleActor)) {
    if(a.kind==='pillar'){
      const px=left+a.x*size,py=top+a.y*size,r=a.radius*size;
      ctx.fillStyle='#8d927c';
      ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#363e32';
      ctx.beginPath();ctx.arc(px,py,r*.52,0,Math.PI*2);ctx.fill();
      continue;
    }
    if(a.kind==='spores'){
      if(!mini){
        ctx.fillStyle='#9fba68';
        for(let i=0;i<4;i++) ctx.fillRect(left+(a.x+(i%2)*.22)*size,top+(a.y+(i%3)*.17)*size,1,1);
      }
      continue;
    }
    if(a.kind==='furnishing'){
      const prop=spriteFor(a), side=Math.max(2,size*.9);
      ctx.drawImage(prop,left+a.x*size-side/2,top+a.y*size-side/2,side,side);
      continue;
    }
    if (mini || size<12) {
      if (a.kind!=='trap') {
        ctx.fillStyle=({crate:a.mainCache?'#d6c884':'#a7b67c',weapon:'#8ed9fa',guard:a.spotted?'#ffab78':'#c1b578',exit:'#84cc91'})[a.kind];
        if(a.done) ctx.fillStyle='#9f967e';
        ctx.beginPath();
        ctx.arc(left+a.x*size,top+a.y*size,Math.max(1.2,size*.32),0,Math.PI*2);
        ctx.fill();
      }
      continue;
    }
    const sprite=spriteFor(a);
    const h=size*.74, w=Math.min(size*.9,h*sprite.width/sprite.height);
    ctx.drawImage(sprite,left+a.x*size-w/2,top+a.y*size-h/2,w,h);
  }
  ctx.save();
  ctx.translate(left+player.x*size,top+player.y*size);
  ctx.rotate(player.angle);
  const markerScale=mini?Math.max(.62,Math.min(1,size/5)):Math.min(1,size/12);
  ctx.scale(markerScale,markerScale);
  ctx.fillStyle=mini?'#43a8ff':'#ffda85';
  ctx.strokeStyle=mini?'#10233b':'#302214';
  ctx.beginPath();
  ctx.moveTo(9,0); ctx.lineTo(-6,-6);
  if(!mini) ctx.lineTo(-4,0);
  ctx.lineTo(-6,6);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function setMode(next) {
  drag=undefined;
  if(next==='map') viewmodel=new ViewmodelCombat25D();
  mode=next;
  for (const id of ['map','eye']) byId(id).setAttribute('aria-pressed',String(id===mode));
}
const moveKeys = new Set(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright']);
addEventListener('keydown',event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.target.closest('select')) return;
  const key = event.key.toLowerCase();
  if (moveKeys.has(key)) { keys.add(key); event.preventDefault(); }
  if (key===' '){
    event.preventDefault();
    if(!event.repeat) punch();
  }
  if (!event.repeat && key==='f') interact();
  if (!event.repeat && key==='g') toggleWeapon();
  if (!event.repeat && key==='r') reloadWeapon();
  if (!event.repeat && key === 'h') heal();
  if (!event.repeat && key === 'v') setMode(mode === 'eye' ? 'map' : 'eye');
});
addEventListener('keyup',event => keys.delete(event.key.toLowerCase()));
addEventListener('blur',() => { keys.clear(); held.clear(); drag=undefined; });
for (const button of buttons) {
  button.addEventListener('pointerdown',event => {
    button.setPointerCapture(event.pointerId);
    held.set(event.pointerId,button.dataset.hold);
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']) {
    button.addEventListener(type,event => held.delete(event.pointerId));
  }
}
canvas.addEventListener('pointerdown',event => {
  if(mode!=='eye' || drag || (event.pointerType==='mouse' && event.button!==0)) return;
  drag={id:event.pointerId,x:event.clientX,y:event.clientY,travel:0,mouse:event.pointerType==='mouse'};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event => {
  if (drag?.id !== event.pointerId) return;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  drag.travel+=Math.hypot(dx,dy);
  if(!drag.mouse || drag.travel>=4) player.angle+=dx*.008;
  drag.x=event.clientX;drag.y=event.clientY;
});
for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  canvas.addEventListener(type,event=>{
    if(drag?.id!==event.pointerId) return;
    const click=type==='pointerup' && drag.mouse && drag.travel<4;
    drag=undefined;
    if(click) punch();
  });
}
byId('map').onclick = () => setMode('map');
byId('eye').onclick = () => setMode('eye');
byId('interact').onclick = interact;
byId('reset').onclick = restart;
locationSelect.onchange=restart;
byId('punch').onclick=punch;
byId('weapon-toggle').onclick=toggleWeapon;
byId('reload').onclick=reloadWeapon;
byId('heal').onclick=heal;
const down = key => keys.has(key) || [...held.values()].includes(key);
let previous, lastRender;
function frame(now) {
  const dt = Math.min(.033,(now-(previous ?? now))/1000);
  previous = now;
  player.angle += (Number(down('e') || down('arrowright'))-Number(down('q') || down('arrowleft')))*dt*2.4;
  const forward=Number(down('w') || down('arrowup'))-Number(down('s') || down('arrowdown'));
  const strafe=Number(down('d'))-Number(down('a'));
  const distance=3.0*dt/Math.max(1,Math.hypot(forward,strafe));
  const fx=Math.cos(player.angle), fy=Math.sin(player.angle);
  const dx=(forward*fx-strafe*fy)*distance, dy=(forward*fy+strafe*fx)*distance;
  const beforeX=player.x,beforeY=player.y;
  if(!defeated && !escaped){
    if (canStand(player.x+dx,player.y)) player.x+=dx;
    if (canStand(player.x,player.y+dy)) player.y+=dy;
    triggerTraps();
  }
  updateGuards(dt);
  const travelled=Math.hypot(player.x-beforeX,player.y-beforeY);
  viewmodel.update(dt,dt>0?travelled/dt:0,travelled>0?strafe:0);
  updateWeapon(dt);
  const lightTick=mode === 'eye' ? Math.floor(now/80) : 0;
  const viewState=[mode,player.x,player.y,player.angle,turn,...guards.map(g=>[g.x,g.y,g.angle,g.moving,g.done,g.hitFlash].join(',')),lightTick,mode==='eye'&&viewmodel.state!=='IDLE'?now:0,mode==='eye'&&(viewmodel.impact||shotTime||reloadTime||shotImpact)?now:0].join('|');
  if (viewState === lastRender) {
    requestAnimationFrame(frame);
    return;
  }
  lastRender = viewState;
  const roomName=tile(Math.floor(player.x),Math.floor(player.y))==='.' ?
    rooms.get(roomKey({x:Math.floor(player.x/ROOM_SPACING)*ROOM_SPACING+ROOM_CENTER,y:Math.floor(player.y/ROOM_SPACING)*ROOM_SPACING+ROOM_CENTER})) : 'Archway';
  const item=activeWeapon();
  byId('punch').textContent=item?'Fire':'Punch';
  byId('weapon-toggle').textContent=item?'Stow weapon':'Equip weapon';
  byId('weapon-toggle').disabled=!carriedWeapon||escaped||defeated;
  byId('reload').disabled=!item||escaped||defeated||item.ammo>=WEAPONS[item.id].capacity||!item.reserve||reloadTime>0;
  const equipment=carriedWeapon ? (item?
    `${WEAPONS[item.id].name} ${item.ammo}/${item.reserve}${reloadTime>0?' · Reloading':''}`:
    `Fists (${WEAPONS[carriedWeapon.id].name} stowed)`) : 'Fists';
  byId('position').textContent=`${roomName} · HP ${health}/100 · Bandages ${bandages} · ${equipment}`;
  byId('inventory').textContent=defeated?'Defeated':escaped?'Expedition ended':recoveredCache?'Main supplies recovered':'';
  if (mode === 'eye') {
    renderFirstPerson(.985+.012*Math.sin(lightTick*.8));
    renderMap(true);
  } else renderMap();
  requestAnimationFrame(frame);
}
ctx.imageSmoothingEnabled=true;
restart();
requestAnimationFrame(frame);
</script>
</body>
</html>
